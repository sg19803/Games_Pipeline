<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пайплайн ИИ-креативов</title>
<style>
:root{
  --bg:#f5f5f7; --ink:#1d1d1f; --ink2:#6e6e73; --ink3:#c7c7cc;
  --hair:#e5e5ea; --blue:#0071e3; --red:#ff3b30; --green:#34c759;
  --peach:#fdf3ea; --peachLine:#f0dcc6; --dia:#eef6ff; --diaLine:#d5e5fb; --diaInk:#0b4a86;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  display:flex; flex-direction:column; height:100vh; overflow:hidden;
}
/* ---- подпись автора: одна маленькая серая строка по центру сверху ----
   стоит вне полотна и вне зума: не масштабируется вместе со схемой, при
   прокрутке остаётся на месте, в снимок и в текстовый экспорт не попадает */
.copy{
  flex:0 0 auto; display:flex; align-items:center; justify-content:center;
  padding:8px 16px 7px; font-size:11.5px; line-height:1.2; letter-spacing:.01em;
  color:#a9a9b0; user-select:none;
}
.copy .sep{margin:0 7px; color:#c9c9cf}
.copy a{
  color:#a9a9b0; text-decoration:none; border-bottom:1px solid transparent;
  transition:color .18s ease, border-color .18s ease;
}
.copy a:hover{color:var(--blue); border-bottom-color:rgba(0,113,227,.35)}
/* ---- панели сверху нет: только подпись автора, остальное окно — лист ---- */
/* ---- полотно: белый лист на сером столе ---- */
.scroller{flex:1 1 auto; overflow:auto; padding:28px 28px 84px; -webkit-overflow-scrolling:touch; display:flex}
.scroller::-webkit-scrollbar{height:12px; width:12px}
.scroller::-webkit-scrollbar-track{background:transparent}
.scroller::-webkit-scrollbar-thumb{background:#d2d2d7; border-radius:6px; border:3px solid var(--bg)}
.scroller::-webkit-scrollbar-thumb:hover{background:#bcbcc2}
/* лист всегда по центру окна — и по горизонтали, и по вертикали;
   margin:auto (а не justify-content) — иначе при зуме обрезается верх */
.zoomer{position:relative; margin:auto}
.sheet{
  position:absolute; left:0; top:0; transform-origin:0 0;
  background:#fff; border-radius:28px; padding:32px;
  box-shadow:0 1px 2px rgba(0,0,0,.05), 0 12px 40px rgba(0,0,0,.07);
}
/* ---- заголовок: большое поле с номером креатива ----
   пусто — серая подсказка «Номер креатива»; ввёл номер — текст чёрный */
/* ---- одна сетка колонок для всей формы: профессия 336 · имя 232 · обязанности 144 · + 40 · − 40,
   зазор 8. Все контролы одной высоты 40px, поэтому строки ровные, а плюсы стоят одной колонкой ---- */
.headrow{display:flex; align-items:center; gap:8px; margin:0 0 24px; height:48px}
.headline{
  margin:0; width:728px; max-width:100%; min-width:0; height:48px;
  font-family:inherit; font-size:40px; font-weight:600; line-height:1.1; letter-spacing:-.02em;
  color:var(--ink); background:transparent; border:0; border-bottom:1px solid var(--hair);
  border-radius:0; padding:0 0 4px; outline:none; transition:border-color .18s ease;
}
.headline::placeholder{color:var(--ink3); opacity:1}
.headline:hover{border-bottom-color:#d0d0d6}
.headline:focus{border-bottom-color:var(--blue)}
/* ---- форма имён: пустое поле с серой подсказкой «ИМЯ» и плюсик рядом ---- */
/* низ формы → верх схемы: 56px, красная шина возврата идёт ровно посередине (28px) */
.names{display:flex; flex-direction:column; gap:8px; margin:0 0 56px}
.nrow{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.ninput{
  width:336px; max-width:100%; height:40px; font:inherit; font-size:15px; letter-spacing:-.004em; color:var(--ink);
  padding:0 14px; border:1px solid var(--hair); border-radius:12px; background:#fff;
  outline:none; transition:border-color .18s ease, box-shadow .18s ease;
}
.ninput::placeholder{color:var(--ink3)}
.ninput:hover{border-color:#d8d8de}
.ninput:focus{border-color:var(--blue); box-shadow:0 0 0 3px rgba(0,113,227,.16)}
/* второе поле строки — человек, который отвечает за эту профессию;
   одно и то же имя в двух строках склеивает профессии в одного человека */
.nperson{
  width:232px; max-width:100%; height:40px; font:inherit; font-size:15px; letter-spacing:-.004em; color:var(--ink);
  padding:0 14px; border:1px solid var(--hair); border-radius:12px; background:#fff;
  outline:none; transition:border-color .18s ease, box-shadow .18s ease, background .18s ease;
}
.nperson::placeholder{color:var(--ink3)}
.nperson:hover{border-color:#d8d8de}
.nperson:focus{border-color:var(--blue); box-shadow:0 0 0 3px rgba(0,113,227,.16)}
/* имя уже встречается в другой строке — эти профессии относятся к одному человеку */
.nperson.shared{border-color:#a9cdf6; background:#f6fbff}
/* мышка на карточке схемы: подсвечиваются строки профессий, которые за неё
   отвечают — все три поля строки (профессия, человек, обязанности) */
.nrow.hl .ninput, .nrow.hl .nperson{
  border-color:#a9cdf6; background:#f2f8ff; box-shadow:0 0 0 3px rgba(0,113,227,.10);
}
.nrow.hl .ndbtn{background:#f2f8ff; border-color:#a9cdf6; color:var(--blue)}
.nrow.hl .ndtext{border-color:#a9cdf6; background:#f2f8ff}
.nplus{
  flex:0 0 auto; width:40px; height:40px; padding:0; border-radius:50%;
  border:1px solid var(--hair); background:#fff; color:var(--blue); cursor:pointer;
  font:inherit; font-size:19px; line-height:1;
  display:flex; align-items:center; justify-content:center;
  transition:background .18s ease, border-color .18s ease, transform .15s ease;
}
.nplus:hover{background:#f4f9ff; border-color:#c9dcf8}
.nplus:active{transform:scale(.94)}
/* минус рядом с плюсом — удалить эту строку */
.nminus{
  flex:0 0 auto; width:40px; height:40px; padding:0; border-radius:50%;
  border:1px solid var(--hair); background:#fff; color:#8e8e93; cursor:pointer;
  font:inherit; font-size:19px; line-height:1;
  display:flex; align-items:center; justify-content:center;
  transition:background .18s ease, border-color .18s ease, transform .15s ease, color .18s ease;
}
.nminus:hover{background:#fff2f1; border-color:#f3c8c4; color:var(--red)}
.nminus:active{transform:scale(.94)}
/* третье поле строки — обязанности. Свёрнуто: маленькая кнопка «Обязанности».
   Клик — под строкой раскрывается текст (профессия не повторяется, всё через запятую) */
.ndbtn{
  flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center; gap:6px;
  width:144px; height:40px; padding:0 14px; border-radius:999px; border:1px solid var(--hair); background:#fff;
  color:var(--ink2); cursor:pointer; font:inherit; font-size:14px; letter-spacing:-.004em;
  transition:background .18s ease, border-color .18s ease, color .18s ease;
}
.ndbtn:hover{background:#f4f9ff; border-color:#c9dcf8; color:var(--blue)}
.ndbtn:focus-visible{outline:none; border-color:var(--blue); box-shadow:0 0 0 3px rgba(0,113,227,.16)}
.ndbtn.open{background:#f6fbff; border-color:#a9cdf6; color:var(--blue)}
.ndar{font-size:12px; line-height:1; transform:translateY(-1px)}
.ndtext{
  flex:0 0 728px; order:20; box-sizing:border-box; width:728px; max-width:100%; margin:0;
  font:inherit; font-size:14px; line-height:1.45; letter-spacing:-.004em; color:var(--ink2);
  padding:10px 14px; border:1px solid var(--hair); border-radius:12px; background:#fbfbfd;
  outline:none; resize:vertical; min-height:40px; overflow:hidden;
  transition:border-color .18s ease, box-shadow .18s ease, background .18s ease;
}
.ndtext[hidden]{display:none}
.ndtext::placeholder{color:var(--ink3)}
.ndtext:hover{border-color:#d8d8de}
.ndtext:focus{border-color:var(--blue); background:#fff; box-shadow:0 0 0 3px rgba(0,113,227,.16)}
/* ---- полотно схемы ---- */
.stage{position:relative}
.frames,.nodes{position:absolute; left:0; top:0}
/* радиусы вложены по-эпловски: лист 28 → рамка 20 → подложка 16 → карточка 12 */
.frame{position:absolute; background:#fafafb; border:1px solid #ececf1; border-radius:20px}
.panel{position:absolute; background:#fdf7f0; border:1px solid #f4e4d1; border-radius:16px}
/* вторая подложка — синяя: «Запись геймплеев» стоит отдельной группой */
.panel.blue{background:#eef5fd; border-color:#d6e6fa}
.wires{position:absolute; left:0; top:0; overflow:visible; pointer-events:none}
/* ---- карточки: тянутся по тексту, текст по центру ---- */
.node{
  position:absolute; display:flex; align-items:center; justify-content:center;
  text-align:center; text-wrap:balance;
  /* текст ломается по любой точке: длинное слово (или «ьвьвьв») не вылезает за рамку,
     а карточка от него растёт вниз */
  overflow-wrap:anywhere; word-break:break-word; min-width:0;
  background:#fff; border:1px solid var(--hair); border-radius:12px; padding:12px;
  font-size:12px; font-weight:500; line-height:1.35; letter-spacing:-.004em; color:var(--ink);
  box-shadow:0 1px 2px rgba(0,0,0,.05);
  transition:box-shadow .2s ease, border-color .2s ease, background .2s ease, color .2s ease, transform .18s ease;
}
.node:hover{
  border-color:#cfcfd8; transform:translateY(-1px);
  box-shadow:0 2px 5px rgba(0,0,0,.07), 0 10px 24px rgba(0,0,0,.10), 0 0 0 3px rgba(0,113,227,.12);
}
/* вход и выход — одинаково: заглавные, жирнее, с разрядкой */
.node.key{font-size:13px; font-weight:600; letter-spacing:.055em; text-transform:uppercase; padding:16px 12px}
.node.peach{background:var(--peach); border-color:var(--peachLine)}
.node.peach:hover{
  border-color:#e2c8a9;
  box-shadow:0 2px 5px rgba(0,0,0,.06), 0 10px 24px rgba(120,80,30,.13), 0 0 0 3px rgba(214,150,80,.18);
}
/* ромб «Утверждение» */
/* размеры ромба продублированы в скрипте (DIA_BOX / DIA_SIDE / DIA_R) — стрелки упираются в его острия */
.node.diamondWrap{width:136px; height:136px; background:none; border:0; box-shadow:none; padding:0}
.diamondInner{
  position:absolute; left:50%; top:50%; width:96px; height:96px;
  transform:translate(-50%,-50%) rotate(45deg);
  background:var(--dia); border:1px solid var(--diaLine); border-radius:12px;
  box-shadow:0 1px 2px rgba(0,0,0,.05);
  transition:box-shadow .2s ease, border-color .2s ease, background .2s ease;
}
.diamondWrap .dtx{position:relative; z-index:1; font-size:12px; font-weight:500; color:var(--diaInk)}
.diamondWrap:hover .diamondInner{
  border-color:#b9d5f7; background:#e7f1ff;
  box-shadow:0 2px 5px rgba(0,0,0,.07), 0 10px 24px rgba(0,80,160,.14), 0 0 0 3px rgba(0,113,227,.14);
}
/* смайлики вместо − и + */
.node.smiley{width:64px; height:64px; padding:0; border-radius:50%; border-width:2.5px; background:#fff}
.node.smiley svg{width:46px; height:46px; display:block}
.node.smiley.bad{border-color:var(--red); color:var(--red)}
.node.smiley.good{border-color:var(--green); color:var(--green)}
.node.smiley:hover{transform:translateY(-1px)}
.node.smiley.bad:hover{box-shadow:0 2px 6px rgba(255,59,48,.28), 0 0 0 3px rgba(255,59,48,.16)}
.node.smiley.good:hover{box-shadow:0 2px 6px rgba(52,199,89,.28), 0 0 0 3px rgba(52,199,89,.16)}
/* ---- галочка «сделано» в углу каждой карточки ----
   стоит на углу рамки (не внутри), поэтому текст остаётся ровно по центру */
.chk{
  position:absolute; left:-8px; top:-8px; width:16px; height:16px; padding:0;
  display:flex; align-items:center; justify-content:center;
  border-radius:6px; border:1.5px solid #d4d4da; background:#fff;
  box-shadow:0 1px 2px rgba(0,0,0,.10); cursor:pointer; opacity:.5;
  -webkit-user-select:none; user-select:none; z-index:2;
  transition:opacity .15s ease, background .15s ease, border-color .15s ease, transform .12s ease;
}
.node .chk{position:absolute}
.node:hover .chk{opacity:1}
.chk:hover{border-color:#9ec9f5; transform:scale(1.08)}
.chk:active{transform:scale(.95)}
.chk svg{width:11px; height:11px; display:block; opacity:0; transition:opacity .12s ease}
.chk svg path{stroke:#fff; stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round}
/* нажата — карточка зелёная */
.node.done{background:#e7f8ec; border-color:#9fd9b2; color:#126b3b}
.node.done .chk{opacity:1; background:var(--green); border-color:var(--green)}
.node.done .chk svg{opacity:1}
.node.done:hover{
  border-color:#7ecb99;
  box-shadow:0 2px 6px rgba(52,199,89,.24), 0 10px 24px rgba(52,199,89,.18), 0 0 0 3px rgba(52,199,89,.16);
}
.node.peach.done{background:#e7f8ec; border-color:#9fd9b2}
/* ---- галочки у смайликов ----
   у ромба «Утверждение» галочки нет; она стоит рядом с каждым кружком,
   а подсветка у кружка своя: «хорошо» — зелёная, «плохо» — красная */
/* галочка у кружка — бейдж на самой окружности (точка 45°), того же размера, что у карточек */
.node.smiley .chk{left:1px; top:1px; opacity:.75}
.node.smiley.done{background:#fff}
.node.smiley.done.good{
  background:#e7f8ec; border-color:var(--green); color:var(--green);
  box-shadow:0 2px 6px rgba(52,199,89,.28), 0 0 0 4px rgba(52,199,89,.16);
}
.node.smiley.done.bad{
  background:#ffeceb; border-color:var(--red); color:var(--red);
  box-shadow:0 2px 6px rgba(255,59,48,.28), 0 0 0 4px rgba(255,59,48,.16);
}
.node.smiley.done.good .chk{opacity:1; background:var(--green); border-color:var(--green)}
.node.smiley.done.bad .chk{opacity:1; background:var(--red); border-color:var(--red)}
.node.smiley.done .chk svg{opacity:1}
/* линии */
.w{fill:none; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round}
.w.b{stroke:var(--blue)}
.w.r{stroke:var(--red)}
.w.t{stroke-width:1.5}
/* ---- пустое поле для заметок внизу каждого блока ----
   высота задана числом: текст внутри поля не растит ни поле, ни блок,
   вместо этого появляется ползунок прокрутки */
.notes{position:absolute; left:0; top:0}
.note{
  position:absolute; margin:0; padding:12px;
  border:1px solid var(--hair); border-radius:12px; background:#fff; color:var(--ink);
  font:inherit; font-size:12px; font-weight:500; line-height:1.4; letter-spacing:-.004em;
  white-space:pre-wrap; overflow-wrap:anywhere; word-break:break-word;
  resize:none; overflow:auto; outline:none;
  transition:border-color .18s ease, box-shadow .18s ease;
}
.note:hover{border-color:#d8d8de}
.note:focus{border-color:var(--blue); box-shadow:0 0 0 3px rgba(0,113,227,.16)}
/* ---- правка текста прямо в карточке ---- */
.node[contenteditable="true"]{
  cursor:text; outline:none; overflow-wrap:anywhere; word-break:break-word;
  -webkit-user-modify:read-write-plaintext-only;
}
/* курсор-текст и отсутствие «прыжка» при правке — без перекраски рамки */
.node[contenteditable="true"]:focus{
  border-color:#8fbdf2; transform:none;
  box-shadow:0 0 0 3px rgba(0,113,227,.16), 0 4px 14px rgba(0,0,0,.08);
  background:#fff;
}
.node.peach[contenteditable="true"]:focus{background:#fffaf4; border-color:#e2c8a9}
/* ромб: правится надпись, а не повёрнутый квадрат */
.diamondWrap .dtx[contenteditable="true"]{cursor:text; outline:none; padding:1px 3px; border-radius:5px}
.diamondWrap .dtx[contenteditable="true"]:focus{background:#fff; box-shadow:0 0 0 3px rgba(0,113,227,.18)}
/* ---- временная кнопка «Сохранить» по центру внизу ---- */
/* гость только смотрит: ни правки карточек, ни полей, ни кнопок «+/−» и галочек */
body.guest .nplus, body.guest .nminus{display:none}
body.guest .chk{pointer-events:none; opacity:.45}
body.guest .node, body.guest .dtx, body.guest #cnum,
body.guest .ninput, body.guest .nperson, body.guest .note,
body.guest .ndtext{cursor:default}
.guestbadge{
  position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:30;
  font-size:12.5px; color:var(--ink3); background:rgba(255,255,255,.92);
  border:1px solid var(--hair); border-radius:999px; padding:6px 14px; pointer-events:none;
}
.savebar[hidden]{display:none}
.savebar{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:30; display:flex; gap:8px}
.savebar button{
  font:inherit; font-size:13px; font-weight:600; letter-spacing:-.004em;
  height:40px; padding:0 24px; border-radius:980px; border:1px solid #d8d8de;
  background:rgba(255,255,255,.94); color:var(--ink); cursor:pointer;
  box-shadow:0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.10);
  -webkit-backdrop-filter:saturate(180%) blur(12px); backdrop-filter:saturate(180%) blur(12px);
  transition:transform .15s ease, box-shadow .2s ease, background .2s ease;
}
.savebar button:hover{
  background:#fff; transform:translateY(-1px);
  box-shadow:0 2px 5px rgba(0,0,0,.08), 0 12px 30px rgba(0,0,0,.14);
}
.savebar button:active{transform:translateY(0) scale(.98)}
/* всплывающее подтверждение */
.toast{
  position:fixed; left:50%; bottom:76px; transform:translate(-50%,8px);
  padding:8px 16px; border-radius:980px; background:#1d1d1f; color:#fff;
  font-size:12.5px; font-weight:500; letter-spacing:-.004em; white-space:nowrap;
  opacity:0; pointer-events:none; z-index:31;
  transition:opacity .2s ease, transform .2s ease;
}
.toast.on{opacity:1; transform:translate(-50%,0)}

</style>
</head>
<body>
<div class="copy" id="copy"><span>&copy; 2026 Serhii Horbunov</span><span class="sep">&middot;</span><a href="https://sergiovida.com" target="_blank" rel="noopener">sergiovida.com</a></div>
<div class="scroller" id="scroller">
  <div class="zoomer" id="zoomer">
    <div class="sheet" id="sheet">
      <div class="headrow">
        <input class="headline" id="cnum" type="text" placeholder="Номер креатива" spellcheck="false" autocomplete="off" aria-label="Номер креатива">
        <button class="nplus" id="cplus" type="button" aria-label="Добавить ещё номер" title="Добавить ещё номер">+</button>
      </div>
      <div class="names" id="names"></div>
      <div class="stage" id="stage">
        <div class="frames" id="frames"></div>
        <div class="notes" id="notes"></div>
        <svg class="wires" id="wires" xmlns="http://www.w3.org/2000/svg"></svg>
        <div class="nodes" id="nodes"></div>
      </div>
    </div>
  </div>
</div>
<div class="savebar" id="savebar" hidden><button id="save" type="button">Сохранить</button><button id="key" type="button">Ключ</button></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function () {
  var NS = 'http://www.w3.org/2000/svg';
  var nodesEl  = document.getElementById('nodes');
  var framesEl = document.getElementById('frames');
  var notesEl  = document.getElementById('notes');
  var wiresEl  = document.getElementById('wires');
  var stageEl  = document.getElementById('stage');
  var sheetEl  = document.getElementById('sheet');
  var zoomerEl = document.getElementById('zoomer');
  var scroller = document.getElementById('scroller');

  /* сетка: один шаг у всех — карточки одной ширины и высоты,
     шины строго посередине между столбцами, стрелки только горизонтальные */
  /* все размеры — кратные 8 (сетка 8pt, как у Apple): отступы, зазоры и ширины
     складываются без остатка, поэтому края карточек, шины и рамки встают в одну линию */
  var W    = 144;     // ширина обычной карточки
  var KW   = 160;     // ширина «ВХОД ЗАДАЧИ» / «Выход задачи»
  var PW   = 120;     // ширина карточек на подложках
  var BUS  = 24;      // от края карточки до вертикальной шины
  var PAD  = 32;      // поле внутри рамки блока
  var FGAP = 32;      // между рамками блоков
  var HGAP = 48;      // между карточками внутри блока (прямая стрелка)
  var GAPY = 24;      // между карточками в столбце
  var SM   = 64;      // диаметр смайлика
  var SM_DY = 64;     // смайлик: насколько выше/ниже оси потока
  var SM_GAP = 16;    // от точки развилки до края кружка
  var BR_GAP = 16;    // от обёртки ромба до точки развилки
  var PGAP = 24;      // между персиковыми карточками
  var PPAD = 16;      // поле внутри персиковой панели
  var PGAPY = 48;     // от основного ряда до персиковой панели
  var PGAPX = 48;     // зазор под вертикальную перемычку в персиковой панели
  var PNGAP = 16;     // между персиковой и синей подложкой
  var RET  = 28;      // красная шина возврата: на столько выше рамок (= половина зазора над схемой)
  /* ромб: квадрат 96px со скруглением 12px, повёрнутый на 45°, в обёртке 136px.
     Скруглённый угол «съедает» острие — стрелки упираются ровно в видимый край */
  var DIA_BOX = 136, DIA_SIDE = 96, DIA_R = 12;
  var DI = (DIA_BOX - DIA_SIDE * Math.SQRT2) / 2 + DIA_R * (Math.SQRT2 - 1);

  var R = {};
  /* поле заметок внизу блока: высота постоянная, текст её не меняет */
  var NOTE_H = 160, NOTE_GAP = 24;
  var framesOut = [];   /* границы блоков — нужны для сохранения текстов по порядку */
  var panelOut = null;  /* границы персиковой панели — чтобы отделить её от основного ряда */
  var panel2Out = null; /* границы синей панели — «Запись геймплеев» */

  function mk(id, text, w, kind) {
    var d = document.createElement('div');
    d.className = 'node' + (kind ? ' ' + kind : '');
    if (w) d.style.width = w + 'px';
    if (kind === 'diamondWrap') {
      /* в ромбе правится надпись, повёрнутый квадрат остаётся фоном */
      d.innerHTML = '<i class="diamondInner"></i><span class="dtx"></span>';
      var sp = d.querySelector('.dtx');
      sp.textContent = text;
      sp.contentEditable = isOwner() ? 'true' : 'false';
      sp.spellcheck = false;
    } else {
      d.textContent = text;
      /* текст карточки правится на месте: ширина задана, высота считается по тексту */
      d.contentEditable = isOwner() ? 'true' : 'false';
      d.spellcheck = false;
    }
    nodesEl.appendChild(d);
    R[id] = { el: d, x: 0, y: 0, w: 0, h: 0, done: false };
    /* у ромба «Утверждение» галочки нет: принято / не принято отмечают смайлики */
    if (kind !== 'diamondWrap') addChk(id);
  }

  /* галочка «сделано»: стоит в углу карточки, клик по ней не запускает правку текста */
  function addChk(id, hint) {
    var d = R[id].el;
    var b = document.createElement('span');
    b.className = 'chk';
    b.setAttribute('contenteditable', 'false');
    b.setAttribute('role', 'checkbox');
    b.setAttribute('aria-checked', R[id].done ? 'true' : 'false');
    b.title = hint || 'Готово — карточка станет зелёной';
    b.innerHTML = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10.5 L8 14.5 L16 5.5"/></svg>';
    b.addEventListener('mousedown', function (e) { e.preventDefault(); e.stopPropagation(); });
    b.addEventListener('click', function (e) {
      e.preventDefault(); e.stopPropagation();
      if (!isOwner()) return;
      setDone(id, !R[id].done);
    });
    d.appendChild(b);
  }

  function setDone(id, on) {
    if (!R[id]) return;
    R[id].done = !!on;
    R[id].el.classList.toggle('done', !!on);
    var b = R[id].el.querySelector('.chk');
    if (b) b.setAttribute('aria-checked', on ? 'true' : 'false');
    readSheet();
    if (manual) apply(); else fit();
    dirty = true;
  }

  /* запись текста в карточку так, чтобы галочка и ромб остались на месте */
  function setText(id, t) {
    if (!R[id]) return;
    var sp = R[id].el.querySelector('.dtx');
    if (sp) { sp.textContent = t; return; }
    R[id].el.textContent = t;
    if (!R[id].el.querySelector('.chk')) addChk(id);
  }

  function mkSmiley(id, kind) {
    var d = document.createElement('div');
    d.className = 'node smiley ' + kind;
    /* глаза и рот крупные: сам кружок 64px, лицо занимает почти всё поле */
    d.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' +
      '<circle cx="8.2" cy="9.2" r="2.3" fill="currentColor"/>' +
      '<circle cx="15.8" cy="9.2" r="2.3" fill="currentColor"/>' +
      '<path d="' + (kind === 'bad'
        ? 'M6.2 17.9c1.8-3.6 9.8-3.6 11.6 0'
        : 'M6.2 14.1c1.8 3.6 9.8 3.6 11.6 0') +
      '" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';
    nodesEl.appendChild(d);
    R[id] = { el: d, x: 0, y: 0, w: 0, h: 0, done: false };
    /* галочка рядом с кружком: «плохо» подсвечивается красным, «хорошо» — зелёным */
    addChk(id, kind === 'bad'
      ? 'Не принято — смайлик станет красным'
      : 'Принято — смайлик станет зелёным');
  }

  /* ---------- 1. содержимое ---------- */
  mk('in',   'ВХОД ЗАДАЧИ', KW, 'key');
  mk('b1',   'Разработка идеи', W);
  mk('b2',   'Подготовка референсов', W);
  mk('scen', 'Создание точного задания с помощью CLAUDE (skill)', W);
  mk('v20',  'Создание сценария для видео', W);
  mk('txt',  'Создание опорных кадров', W);
  mk('mus0', 'Создание фоновой музыки и саунд эффектов (сырые)', W);
  mk('mont', 'Аниматик с статическими опорными кадрами', W);
  mk('d1',   'Утверждение', 0, 'diamondWrap');
  mk('vid',  'Генерация видео veo3 / kling', W);
  mk('comp', 'Композитинг VFX', W);
  mk('mus',  'Разработка музыки и эффектов', W);
  mk('fin',  'Финальный продакшн', W);
  mk('sved', 'Монтаж', W);
  mk('color','Цветокоррекция', W);
  mk('master','Мастеринг звука', W);
  mk('fmont','Финальный монтаж', W);
  mk('d2',   'Утверждение', 0, 'diamondWrap');
  mk('topj', 'Утверждение Топ джинг', W);
  mk('out',  'Выход задачи', KW, 'key');
  mk('p1', 'Создание локаций в ИИ', PW, 'peach');
  mk('p2', 'Создание персонажей ИИ', PW, 'peach');
  mk('p3', 'Сборка опорных кадров', PW, 'peach');
  mk('gmp', 'Запись геймплеев', PW);
  mkSmiley('bad1', 'bad');  mkSmiley('good1', 'good');
  mkSmiley('bad2', 'bad');  mkSmiley('good2', 'good');

  /* ---------- 2. раскладка.
     Считается заново после каждой правки: текст меняет высоту карточки,
     а рамки и линии пересчитываются по новым замерам («резина»). ---------- */
  function layout() {
  framesEl.innerHTML = '';
  wiresEl.innerHTML = '';

  /* замер: ширина задана, высоту даёт сам текст — отсюда «резина» */
  for (var k0 in R) { R[k0].el.style.height = ''; }
  for (var k in R) { R[k].w = R[k].el.offsetWidth; R[k].h = R[k].el.offsetHeight; }

  /* одна высота у всех обычных карточек: «Композитинг VFX» и «Финальный продакшн»
     перестают быть разной высоты, столбцы выходят симметричными,
     а стрелки входят и выходят строго по середине карточки */
  var FIXED = { d1: 1, d2: 1, bad1: 1, bad2: 1, good1: 1, good2: 1, p1: 1, p2: 1, p3: 1, gmp: 1 };
  var commonH = 0;
  var kh;
  for (kh in R) { if (!FIXED[kh]) commonH = Math.max(commonH, R[kh].h); }
  for (kh in R) {
    if (FIXED[kh]) continue;
    R[kh].el.style.height = commonH + 'px';
  }
  /* подстраховка: если карточка всё равно просит больше (совсем длинное слово,
     редкий символ) — общая высота растёт до неё, текст никогда не обрезается */
  var needH = 0;
  for (kh in R) {
    if (FIXED[kh]) continue;
    if (R[kh].el.scrollHeight > needH) needH = R[kh].el.scrollHeight;
  }
  if (needH > commonH) {
    commonH = needH;
    for (kh in R) {
      if (!FIXED[kh]) R[kh].el.style.height = commonH + 'px';
    }
  }
  for (kh in R) { if (!FIXED[kh]) R[kh].h = R[kh].el.offsetHeight; }
  /* персиковая панель выравнивается внутри себя: три карточки одной высоты */
  var PEACH = { p1: 1, p2: 1, p3: 1, gmp: 1 };
  var peachH = 0;
  for (kh in PEACH) peachH = Math.max(peachH, R[kh].h);
  for (kh in PEACH) {
    R[kh].el.style.height = peachH + 'px';
    R[kh].h = R[kh].el.offsetHeight;
  }

  /* раскладка (ось потока y = 0) */
  var axis = 0;
  var F = {};


  function put(id, x, cy) { R[id].x = x; R[id].y = cy - R[id].h / 2; }
  function stack(ids, x, cy) {
    var t = 0, i;
    for (i = 0; i < ids.length; i++) t += R[ids[i]].h;
    t += GAPY * (ids.length - 1);
    var y = cy - t / 2;
    for (i = 0; i < ids.length; i++) { R[ids[i]].x = x; R[ids[i]].y = y; y += R[ids[i]].h + GAPY; }
  }
  function widest(ids) {
    var m = 0;
    for (var i = 0; i < ids.length; i++) m = Math.max(m, R[ids[i]].w);
    return m;
  }
  function bottomOf(ids) {
    var m = -Infinity;
    for (var i = 0; i < ids.length; i++) m = Math.max(m, R[ids[i]].y + R[ids[i]].h);
    return m;
  }

  var c = 0;
  var i;

  /* --- блок 1: вход → идея / референсы --- */
  put('in', c, axis);
  var bus1 = R['in'].x + R['in'].w + BUS;      /* шина развилки после входа */
  var bX = bus1 + BUS;
  stack(['b1', 'b2'], bX, axis);
  var F1 = { l: c - PAD, r: bX + widest(['b1', 'b2']) + PAD };

  /* --- блок 2: задание (CLAUDE) → сценарий для видео / опорные кадры → аниматик → монтаж --- */
  var f2l = F1.r + FGAP;
  var bus2 = f2l + PAD;                        /* шина слияния перед сценарием */
  var scenX = bus2 + BUS;
  put('scen', scenX, axis);
  var bus3 = scenX + R.scen.w + BUS;           /* шина развилки сценария */
  var vX = bus3 + BUS;
  stack(['v20', 'txt'], vX, axis);
  var bus4 = vX + widest(['v20', 'txt']) + BUS; /* шина слияния перед аниматиком */
  var montX = bus4 + BUS;
  put('mont', montX, axis);
  var F2 = { l: f2l, r: montX + widest(['mont']) + PAD };
  /* «сырые» музыка и звук стоят под аниматиком и входят в него снизу — как на референсе */
  R.mus0.x = montX + (R.mont.w - R.mus0.w) / 2;
  R.mus0.y = R.mont.y + R.mont.h + GAPY;
  F.mainBot2 = bottomOf(['scen', 'v20', 'txt', 'mont', 'mus0']);

  /* персиковая панель — второй ряд внутри блока 2, как на референсе:
     две карточки друг над другом сходятся в одну «Сборка опорных кадров» */
  var panelTop = F.mainBot2 + PGAPY;
  var pCol = ['p1', 'p2'];
  var pColH = R.p1.h + PGAP + R.p2.h;
  var pColX = scenX + PPAD;                    /* левый край панели ровно по столбцу карточек */
  R.p1.x = pColX; R.p1.y = panelTop + PPAD;
  R.p2.x = pColX; R.p2.y = R.p1.y + R.p1.h + PGAP;
  /* правая карточка стоит ровно между двумя левыми */
  R.p3.x = pColX + widest(pCol) + PGAPX;
  R.p3.y = R.p1.y + (pColH - R.p3.h) / 2;
  var pGroupW = widest(pCol) + PGAPX + R.p3.w;
  /* панель облегает карточки, как на референсе, а не тянется во всю ширину блока */
  F.panel = {
    l: pColX - PPAD,
    r: pColX + pGroupW + PPAD,
    t: panelTop,
    b: panelTop + PPAD * 2 + pColH
  };
  /* синяя подложка с «Записью геймплеев» — справа от персиковой, по её верху */
  /* обе подложки одной высоты, карточка в синей стоит по её середине */
  var blueL = F.panel.r + PNGAP;
  R.gmp.x = blueL + PPAD;
  R.gmp.y = F.panel.t + (F.panel.b - F.panel.t - R.gmp.h) / 2;
  F.panel2 = {
    l: blueL,
    r: blueL + PPAD * 2 + R.gmp.w,
    t: F.panel.t,
    b: F.panel.b
  };
  /* если подложка не влезла — блок 2 растягивается, но ничего не торчит */
  if (F.panel2.r + PAD > F2.r) F2.r = F.panel2.r + PAD;

  /* --- блок 3: первое «Утверждение» и два смайлика --- */
  var f3l = F2.r + FGAP;
  put('d1', f3l + PAD, axis);
  var br1 = R.d1.x + R.d1.w + BR_GAP;          /* точка развилки после ромба: ширина рамки остаётся кратной 8 */
  var sm1x = br1 + SM_GAP + SM / 2;            /* центр красного и зелёного кружка */
  R.bad1.x = sm1x - SM / 2;  R.bad1.y = axis - SM_DY - SM / 2;
  R.good1.x = sm1x - SM / 2; R.good1.y = axis + SM_DY - SM / 2;
  var F3 = { l: f3l, r: sm1x + SM / 2 + PAD };

  /* --- блок 4: четыре ветки → три работы рядом (монтаж, цвет, звук) → финальный монтаж --- */
  var f4l = F3.r + FGAP;
  var bus5 = f4l + PAD;                        /* шина четырёх веток */
  var v4X = bus5 + BUS;
  stack(['vid', 'comp', 'mus', 'fin'], v4X, axis);
  var bus6 = v4X + widest(['vid', 'comp', 'mus', 'fin']) + BUS;  /* шина слияния четырёх */
  var bus7 = bus6 + BUS;                       /* развилка на три работы */
  var workX = bus7 + BUS;
  /* монтаж, цветокоррекция и мастеринг звука стоят рядом: это параллельная работа */
  stack(['sved', 'color', 'master'], workX, axis);
  var bus8 = workX + widest(['sved', 'color', 'master']) + BUS;   /* шина слияния трёх */
  var fmX = bus8 + BUS;
  put('fmont', fmX, axis);                     /* три работы сводятся в финальный монтаж */
  var F45 = { l: f4l, r: fmX + R.fmont.w + PAD };

  /* --- блок 5: второе «Утверждение» со смайликами; блок 6: джингл → выход --- */
  var f6l = F45.r + FGAP;
  put('d2', f6l + PAD, axis);
  var br2 = R.d2.x + R.d2.w + BR_GAP;
  var sm2x = br2 + SM_GAP + SM / 2;
  R.bad2.x = sm2x - SM / 2;  R.bad2.y = axis - SM_DY - SM / 2;
  R.good2.x = sm2x - SM / 2; R.good2.y = axis + SM_DY - SM / 2;
  /* рамка 5 — точная копия рамки 3: ромб, развилка, два кружка */
  var F6 = { l: f6l, r: sm2x + SM / 2 + PAD };
  var f7l = F6.r + FGAP;                       /* рамка 6: джингл и выход */
  /* «да» поднимается на ось по шине у левого края рамки 6 — как вход в рамки 2 и 4 */
  var jx = f7l + PAD;
  var topjX = jx + BUS;
  put('topj', topjX, axis);
  var outX = topjX + R.topj.w + HGAP;
  put('out', outX, axis);
  var F7 = { l: f7l, r: outX + R.out.w + PAD };

  /* ---------- 3. рамки блоков и общий сдвиг ---------- */
  var minT = Infinity, maxB = -Infinity;
  for (var kk in R) {
    if (PEACH[kk]) continue;   /* карточки подложек живут ниже главного ряда */
    minT = Math.min(minT, R[kk].y);
    maxB = Math.max(maxB, R[kk].y + R[kk].h);
  }
  var frameTop = minT - PAD;
  /* все рамки одной высоты: низ считается и по персиковой панели, иначе блок 2 торчит */
  /* под карточками (и персиковой панелью) оставлено место под поле заметок:
     рамка блока вытянута вниз на высоту поля, сам текст рамку не растит */
  var notesTop = Math.max(maxB, F.panel.b, F.panel2.b) + NOTE_GAP;
  var frameBot = notesTop + NOTE_H + PAD;

  var frames = [F1, F2, F3, F45, F6, F7].map(function (f) {
    return { l: f.l, r: f.r, t: frameTop, b: frameBot };
  });

  framesOut = frames;
  panelOut = F.panel;
  panel2Out = F.panel2;

  var fL = Infinity, fR = -Infinity, fB = -Infinity;
  for (i = 0; i < frames.length; i++) {
    fL = Math.min(fL, frames[i].l); fR = Math.max(fR, frames[i].r);
    fB = Math.max(fB, frames[i].b);
  }
  var OX = -fL, OY = -frameTop;
  var stageW = Math.round(fR - fL), stageH = Math.round(fB - frameTop);
  var busY = frameTop - RET;  /* шина возврата — над рамками, ровно посередине зазора */

  /* ставим всё на свои места */
  for (var k2 in R) {
    R[k2].el.style.left = Math.round(R[k2].x + OX) + 'px';
    R[k2].el.style.top = Math.round(R[k2].y + OY) + 'px';
  }
  for (i = 0; i < frames.length; i++) {
    var fd = document.createElement('div');
    fd.className = 'frame';
    fd.style.left = Math.round(frames[i].l + OX) + 'px';
    fd.style.top = Math.round(frames[i].t + OY) + 'px';
    fd.style.width = Math.round(frames[i].r - frames[i].l) + 'px';
    fd.style.height = Math.round(frames[i].b - frames[i].t) + 'px';
    framesEl.appendChild(fd);
  }
  var pn = document.createElement('div');
  pn.className = 'panel';
  pn.style.left = Math.round(F.panel.l + OX) + 'px';
  pn.style.top = Math.round(F.panel.t + OY) + 'px';
  pn.style.width = Math.round(F.panel.r - F.panel.l) + 'px';
  pn.style.height = Math.round(F.panel.b - F.panel.t) + 'px';
  framesEl.appendChild(pn);
  var pn2 = document.createElement('div');
  pn2.className = 'panel blue';
  pn2.style.left = Math.round(F.panel2.l + OX) + 'px';
  pn2.style.top = Math.round(F.panel2.t + OY) + 'px';
  pn2.style.width = Math.round(F.panel2.r - F.panel2.l) + 'px';
  pn2.style.height = Math.round(F.panel2.b - F.panel2.t) + 'px';
  framesEl.appendChild(pn2);

  /* ---------- 3б. пустые поля для заметок: по одному в каждом блоке ----------
     создаём один раз, при пересборке только двигаем — набранный текст остаётся */
  while (notesEl.children.length > frames.length) notesEl.removeChild(notesEl.lastChild);
  while (notesEl.children.length < frames.length) {
    var nt = document.createElement('textarea');
    nt.className = 'note';
    nt.spellcheck = false;
    nt.setAttribute('aria-label', 'Заметки блока');
    notesEl.appendChild(nt);
  }
  for (i = 0; i < frames.length; i++) {
    var ne = notesEl.children[i];
    ne.style.left = Math.round(frames[i].l + PAD + OX) + 'px';
    ne.style.top = Math.round(notesTop + OY) + 'px';
    ne.style.width = Math.round(frames[i].r - frames[i].l - 2 * PAD) + 'px';
    ne.style.height = Math.round(NOTE_H) + 'px';
  }

  stageEl.style.width = stageW + 'px';
  stageEl.style.height = stageH + 'px';
  wiresEl.setAttribute('width', stageW);
  wiresEl.setAttribute('height', stageH);
  wiresEl.setAttribute('viewBox', '0 0 ' + stageW + ' ' + stageH);
  /* ---------- 4. линии ---------- */
  function svg(tag, attrs) {
    var e = document.createElementNS(NS, tag);
    for (var a in attrs) e.setAttribute(a, attrs[a]);
    return e;
  }
  var defs = svg('defs', {});
  [['ab', '#0071e3'], ['ar', '#ff3b30']].forEach(function (m) {
    var mk = svg('marker', {
      id: m[0], viewBox: '0 0 10 10', refX: '9.2', refY: '5',
      markerWidth: '9', markerHeight: '9', markerUnits: 'userSpaceOnUse', orient: 'auto'
    });
    mk.appendChild(svg('path', { d: 'M0.6 0.6 L9.2 5 L0.6 9.4 z', fill: m[1] }));
    defs.appendChild(mk);
  });
  wiresEl.appendChild(defs);

  var g = svg('g', { transform: 'translate(' + OX + ',' + OY + ')' });
  wiresEl.appendChild(g);

  function n(v) { return Math.round(v * 100) / 100; }

  function rounded(pts, r) {
    if (pts.length < 3) {
      return 'M' + n(pts[0][0]) + ' ' + n(pts[0][1]) + 'L' + n(pts[1][0]) + ' ' + n(pts[1][1]);
    }
    var d = 'M' + n(pts[0][0]) + ' ' + n(pts[0][1]);
    for (var i = 1; i < pts.length - 1; i++) {
      var p0 = pts[i - 1], p1 = pts[i], p2 = pts[i + 1];
      var v1x = p1[0] - p0[0], v1y = p1[1] - p0[1];
      var v2x = p2[0] - p1[0], v2y = p2[1] - p1[1];
      var l1 = Math.sqrt(v1x * v1x + v1y * v1y), l2 = Math.sqrt(v2x * v2x + v2y * v2y);
      if (!l1 || !l2) continue;
      var rr = Math.min(r, l1 / 2, l2 / 2);
      d += 'L' + n(p1[0] - v1x / l1 * rr) + ' ' + n(p1[1] - v1y / l1 * rr) +
           'Q' + n(p1[0]) + ' ' + n(p1[1]) + ' ' +
           n(p1[0] + v2x / l2 * rr) + ' ' + n(p1[1] + v2y / l2 * rr);
    }
    var e2 = pts[pts.length - 1];
    return d + 'L' + n(e2[0]) + ' ' + n(e2[1]);
  }

  function wire(pts, colour, marker, thin) {
    var p = svg('path', { d: rounded(pts, 8), 'class': 'w ' + colour + (thin ? ' t' : '') });
    if (marker) p.setAttribute('marker-end', 'url(#' + marker + ')');
    g.appendChild(p);
  }

  function X1(k) { return R[k].x; }
  function X2(k) { return R[k].x + R[k].w; }
  function YC(k) { return R[k].y + R[k].h / 2; }
  function YT(k) { return R[k].y; }

  /* вход → две ветки */
  wire([[X2('in'), axis], [bus1, axis]], 'b');
  wire([[bus1, YC('b1')], [bus1, YC('b2')]], 'b');
  wire([[bus1, YC('b1')], [X1('b1'), YC('b1')]], 'b', 'ab');
  wire([[bus1, YC('b2')], [X1('b2'), YC('b2')]], 'b', 'ab');

  /* две ветки → сценарий */
  wire([[X2('b1'), YC('b1')], [bus2, YC('b1')]], 'b');
  wire([[X2('b2'), YC('b2')], [bus2, YC('b2')]], 'b');
  wire([[bus2, YC('b1')], [bus2, YC('b2')]], 'b');
  wire([[bus2, axis], [X1('scen'), axis]], 'b', 'ab');

  /* сценарий → видео / тексты → монтаж */
  wire([[X2('scen'), axis], [bus3, axis]], 'b');
  wire([[bus3, YC('v20')], [bus3, YC('txt')]], 'b');
  wire([[bus3, YC('v20')], [X1('v20'), YC('v20')]], 'b', 'ab');
  wire([[bus3, YC('txt')], [X1('txt'), YC('txt')]], 'b', 'ab');
  wire([[X2('v20'), YC('v20')], [bus4, YC('v20')]], 'b');
  wire([[X2('txt'), YC('txt')], [bus4, YC('txt')]], 'b');
  wire([[bus4, YC('v20')], [bus4, YC('txt')]], 'b');
  wire([[bus4, axis], [X1('mont'), axis]], 'b', 'ab');

  /* аниматик → утверждение */
  wire([[X2('mont'), axis], [X1('d1') + DI, axis]], 'b', 'ab');

  /* «сырые» музыка и звук входят в аниматик снизу */
  var m0x = R.mus0.x + R.mus0.w / 2;
  wire([[m0x, YT('mus0')], [m0x, R.mont.y + R.mont.h]], 'b', 'ab');

  /* «Утверждение»: развилка на смайлики, красный возврат, зелёный выход */
  function gate(dId, badId, goodId, brX, targetId) {
    var bcx = R[badId].x + R[badId].w / 2;         /* центр красного кружка */
    wire([[X2(dId) - DI, axis], [brX, axis]], 'b');
    wire([[brX, YC(badId)], [brX, YC(goodId)]], 'b');
    /* стрелки входят в кружки слева — как на референсе */
    wire([[brX, YC(badId)], [X1(badId), YC(badId)]], 'b', 'ab');
    wire([[brX, YC(goodId)], [X1(goodId), YC(goodId)]], 'b', 'ab');
    var tx = X1(targetId) + R[targetId].w / 2;
    /* красный возврат: из верхнего кружка вверх, по шине назад, вниз в целевой блок */
    wire([[bcx, YT(badId)], [bcx, busY], [tx, busY], [tx, YT(targetId)]], 'r', 'ar');
  }
  gate('d1', 'bad1', 'good1', br1, 'scen');
  gate('d2', 'bad2', 'good2', br2, 'vid');

  /* «да» → четыре ветки */
  var fanYs = [YC('vid'), YC('comp'), YC('mus'), YC('fin'), YC('good1')];
  wire([[X2('good1'), YC('good1')], [bus5, YC('good1')]], 'b');
  wire([[bus5, Math.min.apply(null, fanYs)], [bus5, Math.max.apply(null, fanYs)]], 'b');
  ['vid', 'comp', 'mus', 'fin'].forEach(function (k) {
    wire([[bus5, YC(k)], [X1(k), YC(k)]], 'b', 'ab');
  });

  /* четыре ветки сходятся в одну шину */
  ['vid', 'comp', 'mus', 'fin'].forEach(function (k) {
    wire([[X2(k), YC(k)], [bus6, YC(k)]], 'b');
  });
  wire([[bus6, YC('vid')], [bus6, YC('fin')]], 'b');

  /* шина → три работы рядом: монтаж, цветокоррекция, мастеринг звука */
  wire([[bus6, axis], [bus7, axis]], 'b');
  wire([[bus7, YC('sved')], [bus7, YC('master')]], 'b');
  ['sved', 'color', 'master'].forEach(function (k) {
    wire([[bus7, YC(k)], [X1(k), YC(k)]], 'b', 'ab');
  });

  /* три работы снова сходятся → финальный монтаж → второе утверждение */
  ['sved', 'color', 'master'].forEach(function (k) {
    wire([[X2(k), YC(k)], [bus8, YC(k)]], 'b');
  });
  wire([[bus8, YC('sved')], [bus8, YC('master')]], 'b');
  wire([[bus8, axis], [X1('fmont'), axis]], 'b', 'ab');
  wire([[X2('fmont'), axis], [X1('d2') + DI, axis]], 'b', 'ab');


  /* «да» → джингл → выход */
  wire([[X2('good2'), YC('good2')], [jx, YC('good2')], [jx, axis]], 'b');
  wire([[jx, axis], [X1('topj'), axis]], 'b', 'ab');
  wire([[X2('topj'), axis], [X1('out'), axis]], 'b', 'ab');

  /* персиковая панель: локации и персонажи сходятся в «Сборку опорных кадров» */
  var pmx = Math.max(X2('p1'), X2('p2')) + PGAPX / 2;
  wire([[X2('p1'), YC('p1')], [pmx, YC('p1')]], 'b', null, true);
  wire([[X2('p2'), YC('p2')], [pmx, YC('p2')]], 'b', null, true);
  wire([[pmx, YC('p1')], [pmx, YC('p2')]], 'b', null, true);
  wire([[pmx, YC('p3')], [X1('p3'), YC('p3')]], 'b', 'ab', true);

  /* размеры листа изменились — обновляем рамку прокрутки и масштаб */
  readSheet();
  if (manual) apply(); else fit();
  }

  /* ---------- 4б. номер креатива: большое поле сверху + строки под ним ---------- */
  var namesEl = document.getElementById('names');
  var cnumEl  = document.getElementById('cnum');

  /* готовые тексты обязанностей для десяти профессий схемы.
     Профессию в тексте не повторяем — она стоит в первом поле строки,
     и не списком, а одной фразой через запятую. */
  var DUTIES = {
    'трафик менеджер': 'принимает задачу от заказчика в Asana, запрашивает и собирает входные данные: бриф, референсы, примеры, ставит задачу команде и следит за сроками, принимает готовую работу на выходе',
    'ии артист': 'создаёт локации и персонажей, собирает опорные кадры для аниматика, генерирует видео на продакшне, следит, чтобы персонажи и стиль не менялись от кадра к кадру',
    'саунд артист': 'делает сырую музыку и звуковые эффекты для аниматика, готовит финальную музыку и эффекты под монтаж, записывает или генерирует закадровый голос, делает мастеринг звука',
    'геймплэй артист': 'записывает геймплей для опорных кадров, делает финальные геймплеи под утверждённый сценарий',
    'режиссер': 'составляет точное задание и сценарий, принимает решения на препродакшне и продакшне, отвечает за аниматик перед утверждением, вносит правки после утверждения',
    'режиссер монтажа': 'монтирует аниматик и финальное видео, делает цветокоррекцию, делает ресайзы, рендерит и выгружает их на Google Диск',
    'ответственный за задачу': 'проверяет работу на обоих утверждениях, пропускает дальше или возвращает с правками на один или два этапа назад, отвечает за соответствие результата брифу заказчика',
    'композитинг артист': 'сводит в кадре ИИ-генерацию, геймплей и графику, убирает артефакты ИИ',
    'vfx артист': 'делает визуальные эффекты: частицы, свет, переходы',
    'контент менеджер': 'принимает ресайзы, называет и раскладывает файлы, передаёт материалы заказчику и ведёт архив'
  };
  /* в сохранённых данных встречается опечатка «Ответсвенный» — строку без текста не оставляем */
  DUTIES['ответсвенный за задачу'] = DUTIES['ответственный за задачу'];
  /* «ё» = «е», дефис = пробел: «ИИ-артист» и «ИИ артист» — одна строка словаря */
  function dutyKey(s) {
    return String(s == null ? '' : s)
      .replace(/\u0451/g, '\u0435').replace(/\u0401/g, '\u0415')
      .replace(/[-\u2010-\u2015]+/g, ' ')
      .replace(/\s+/g, ' ').trim().toLowerCase();
  }
  function dutyDefault(role) {
    return DUTIES[dutyKey(role)] || '';
  }

  /* ещё одна строка с номером — появляется по плюсику */
  /* одна строка = профессия + человек + обязанности; плюсик добавляет такую же пустую */
  function addRow(role, person, duties) {
    var row = document.createElement('div');
    row.className = 'nrow';
    var inp = document.createElement('input');
    inp.className = 'ninput';
    inp.type = 'text';
    inp.placeholder = 'Профессия';
    inp.title = 'Профессия';
    inp.spellcheck = false;
    inp.autocomplete = 'off';
    inp.value = role || '';
    /* имя человека: одно и то же имя в разных строках = один человек */
    var pin = document.createElement('input');
    pin.className = 'nperson';
    pin.type = 'text';
    pin.placeholder = 'Имя человека';
    pin.title = 'Имя человека, который отвечает за эту профессию';
    pin.spellcheck = false;
    pin.autocomplete = 'off';
    pin.value = person || '';
    /* обязанности: свёрнуты в кнопку, по клику под строкой раскрывается текст.
       Готовый текст для известной профессии подставляется сразу; пусто — значит пусто */
    var dbtn = document.createElement('button');
    dbtn.className = 'ndbtn';
    dbtn.type = 'button';
    dbtn.title = 'Обязанности — нажми, чтобы раскрыть текст';
    dbtn.setAttribute('aria-expanded', 'false');
    var dar = document.createElement('span');
    dar.className = 'ndar';
    dar.textContent = '\u25B8';
    var dlab = document.createElement('span');
    dlab.className = 'ndlab';
    dlab.textContent = 'Обязанности';
    dbtn.appendChild(dar);
    dbtn.appendChild(dlab);
    var dta = document.createElement('textarea');
    dta.className = 'ndtext';
    dta.rows = 2;
    dta.placeholder = 'Обязанности — одной фразой через запятую';
    dta.title = 'Что этот человек делает';
    dta.spellcheck = false;
    dta.value = (duties == null) ? dutyDefault(role) : String(duties);
    dta.setAttribute('hidden', '');
    var btn = document.createElement('button');
    btn.className = 'nplus';
    btn.type = 'button';
    btn.title = 'Добавить строку';
    btn.setAttribute('aria-label', 'Добавить строку');
    btn.textContent = '+';
    var bminus = document.createElement('button');
    bminus.className = 'nminus';
    bminus.type = 'button';
    bminus.title = 'Удалить строку';
    bminus.setAttribute('aria-label', 'Удалить строку');
    bminus.textContent = '\u2212';
    row.appendChild(inp);
    row.appendChild(pin);
    row.appendChild(dbtn);
    row.appendChild(btn);
    row.appendChild(bminus);
    row.appendChild(dta);
    namesEl.appendChild(row);
    return inp;
  }

  /* поле обязанностей подстраивает высоту под текст — чтобы ничего не обрезалось */
  function autoGrow(ta) {
    if (!ta || ta.hasAttribute('hidden')) return;
    ta.style.height = 'auto';
    ta.style.height = Math.max(40, ta.scrollHeight) + 'px';
  }

  /* все номера по порядку: сначала большое поле, потом строки; пустые не считаем */
  function creativeValues() {
    var out = [];
    var head = (cnumEl.value || '').trim();
    if (head) out.push(head);
    var inputs = namesEl.querySelectorAll('.ninput');
    for (var i = 0; i < inputs.length; i++) {
      var v = (inputs[i].value || '').trim();
      if (v) out.push(v);
    }
    return out;
  }

  /* точный вид полей: что в большом поле и каждая строка как есть,
     включая пустые — иначе после сохранения число полей не восстановить */
  function nameRows() {
    var out = [], rows = namesEl.querySelectorAll('.nrow');
    for (var i = 0; i < rows.length; i++) {
      var ri = rows[i].querySelector('.ninput');
      var pi = rows[i].querySelector('.nperson');
      var di = rows[i].querySelector('.ndtext');
      out.push({ role: ri ? (ri.value || '') : '',
                 person: pi ? (pi.value || '') : '',
                 duties: di ? (di.value || '') : '' });
    }
    return out;
  }

  /* кто за что отвечает: имя человека → его профессии.
     Одно имя в двух строках = один человек с двумя профессиями. */
  function personGroups() {
    var out = {}, rows = nameRows();
    for (var i = 0; i < rows.length; i++) {
      var who = (rows[i].person || '').replace(/\s+/g, ' ').trim();
      var role = (rows[i].role || '').replace(/\s+/g, ' ').trim();
      if (!who) continue;
      if (!out[who]) out[who] = [];
      if (role) out[who].push(role);
    }
    return out;
  }

  function nameState() {
    return { head: cnumEl.value || '', rows: nameRows(), people: personGroups() };
  }

  /* заметки блоков: номер блока (с 1) → текст как есть; пустые не сохраняем */
  function noteValues() {
    var out = {};
    if (!notesEl) return out;
    for (var i = 0; i < notesEl.children.length; i++) {
      var v = notesEl.children[i].value;
      if (v && v.replace(/\s+/g, ' ').trim()) out[String(i + 1)] = v;
    }
    return out;
  }

  function onPlus(e) {
    if (!OWNER) return;
    if (!e.target || !e.target.closest) return;
    if (!e.target.closest('.nplus')) return;
    var inp = addRow('');
    /* лист стал выше — пересчитываем рамку прокрутки и масштаб */
    readSheet();
    if (manual) apply(); else fit();
    inp.focus();
  }
  namesEl.addEventListener('click', onPlus);
  document.getElementById('cplus').addEventListener('click', onPlus);

  /* минус — убрать строку целиком; последняя не исчезает, а просто очищается */
  function onMinus(e) {
    if (!OWNER) return;
    if (!e.target || !e.target.closest) return;
    var mb = e.target.closest('.nminus');
    if (!mb) return;
    var row = mb.closest('.nrow');
    if (!row || !row.parentNode) return;
    row.parentNode.removeChild(row);
    ensureRow();
    dirty = true;
    readSheet();
    if (manual) apply(); else fit();
  }
  namesEl.addEventListener('click', onMinus);

  /* подсветка: имя уже стоит в другой строке — это тот же человек */
  function markShared() {
    var rows = nameRows(), seen = {}, i, who;
    for (i = 0; i < rows.length; i++) {
      who = (rows[i].person || '').replace(/\s+/g, ' ').trim().toLowerCase();
      if (who) seen[who] = (seen[who] || 0) + 1;
    }
    var els = namesEl.querySelectorAll('.nperson');
    for (i = 0; i < els.length; i++) {
      who = (els[i].value || '').replace(/\s+/g, ' ').trim().toLowerCase();
      var n = who ? (seen[who] || 0) : 0;
      els[i].classList.toggle('shared', n > 1);
      els[i].title = n > 1
        ? 'Это имя уже есть ещё в ' + (n - 1) + ' строке — профессии склеятся в одного человека'
        : 'Имя человека, который отвечает за эту профессию';
    }
  }
  namesEl.addEventListener('input', markShared);

  /* клик по кнопке «Обязанности»: раскрыть или снова свернуть текст этой строки.
     Смотреть можно всем — гостю тоже; править текст может только владелец (readOnly) */
  namesEl.addEventListener('click', function (e) {
    var b = (e.target && e.target.closest) ? e.target.closest('.ndbtn') : null;
    if (!b) return;
    var row = b.closest('.nrow');
    var ta = row ? row.querySelector('.ndtext') : null;
    if (!ta) return;
    var wasOpen = !ta.hasAttribute('hidden');
    if (wasOpen) {
      ta.setAttribute('hidden', '');
      b.classList.remove('open');
    } else {
      ta.removeAttribute('hidden');
      b.classList.add('open');
      autoGrow(ta);
    }
    b.setAttribute('aria-expanded', wasOpen ? 'false' : 'true');
    b.title = wasOpen ? 'Обязанности — нажми, чтобы раскрыть текст'
                      : 'Обязанности — нажми, чтобы свернуть текст';
    var ar = b.querySelector('.ndar');
    if (ar) ar.textContent = wasOpen ? '\u25B8' : '\u25BE';
    readSheet();
    apply();
  });

  /* вписал профессию — обязанности подставляются из готового списка,
     но только если поле обязанностей пустое (руками вписанное не затираем) */
  namesEl.addEventListener('change', function (e) {
    var t = e.target;
    if (!t || !t.classList || !t.classList.contains('ninput')) return;
    if (!isOwner()) return;
    var row = (t.closest) ? t.closest('.nrow') : null;
    if (!row) return;
    var ta = row.querySelector('.ndtext');
    if (!ta || (ta.value || '').replace(/\s+/g, ' ').trim()) return;
    var def = dutyDefault(t.value);
    if (!def) return;
    ta.value = def;
    if (!ta.hasAttribute('hidden')) autoGrow(ta);
    dirty = true;
    readSheet();
    apply();
  });

  /* на странице всегда есть хотя бы одна строка с подсказкой «Профессия» */
  function ensureRow() {
    if (!namesEl.querySelector('.ninput')) addRow('', '');
  }
  ensureRow();

  /* ---------- 5. зум ---------- */
  var zoom = 1, manual = false, SW = 0, SH = 0;


  function readSheet() { SW = sheetEl.offsetWidth; SH = sheetEl.offsetHeight; }
  function apply() {
    sheetEl.style.transform = 'scale(' + zoom + ')';
    zoomerEl.style.width = Math.round(SW * zoom) + 'px';
    zoomerEl.style.height = Math.round(SH * zoom) + 'px';
  }
  function setZoom(z) {
    zoom = Math.max(0.25, Math.min(2, Math.round(z * 100) / 100));
    manual = true;
    apply();
  }
  function fit() {
    var aw = scroller.clientWidth - 56;
    var ah = scroller.clientHeight - 112;   /* 28 сверху + 84 снизу (место под кнопку «Сохранить») */
    zoom = Math.max(0.25, Math.min(1, aw / SW, ah / SH));
    zoom = Math.round(zoom * 100) / 100;
    manual = false;
    apply();
  }

  /* кнопок больше нет — зум с клавиатуры и с Ctrl+колесо */
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    /* при правке текста клавиши — это буквы, а не зум */
    var ae = document.activeElement;
    if (ae && (ae.isContentEditable || ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')) return;
    if (e.key === '+' || e.key === '=') { setZoom(zoom + 0.1); e.preventDefault(); }
    else if (e.key === '-' || e.key === '_') { setZoom(zoom - 0.1); e.preventDefault(); }
    else if (e.key === '0') { fit(); e.preventDefault(); }
  });

  scroller.addEventListener('wheel', function (e) {
    if (e.ctrlKey) { setZoom(zoom + (e.deltaY < 0 ? 0.1 : -0.1)); e.preventDefault(); return; }
    if (!e.shiftKey) return;
    scroller.scrollLeft += e.deltaY;
    e.preventDefault();
  }, { passive: false });
  window.addEventListener('resize', function () { readSheet(); if (!manual) fit(); });

  /* ---------- 6. правка текста и сохранение в .txt рядом со схемой ---------- */
  var toastEl = document.getElementById('toast');
  var toastTimer = 0;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('on'); }, 2800);
  }

  /* правка меняет высоту карточки — пересобираем раскладку (с задержкой, чтобы не дёргалось) */
  var tick = 0, dirty = false;
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (!t) return;
    if (!t.isContentEditable) {
      /* номер креатива — тоже правка: при закрытии вкладки предупредим */
      if (t.id === 'cnum' || String(t.className || '').indexOf('ninput') >= 0
          || String(t.className || '').indexOf('note') >= 0) dirty = true;
      /* обязанности: поле тянется за текстом и считается правкой */
      if (String(t.className || '').indexOf('ndtext') >= 0) {
        dirty = true;
        autoGrow(t);
        readSheet();
        apply();
      }

      return;
    }
    dirty = true;
    if (tick) return;
    tick = setTimeout(function () { tick = 0; layout(); }, 80);
  });

  /* не даём закрыть вкладку с несохранёнными правками молча */
  window.addEventListener('beforeunload', function (e) {
    if (!dirty) return;
    e.preventDefault();
    e.returnValue = '';
    return '';
  });

  /* Enter — не новый абзац: текст переносится сам; Esc — закончить правку */
  document.addEventListener('keydown', function (e) {
    if (!e.target || !e.target.isContentEditable) return;
    if (e.key === 'Enter') { e.preventDefault(); return; }
    if (e.key === 'Escape') e.target.blur();
  });

  /* вставка — только чистым текстом, без чужого оформления */
  document.addEventListener('paste', function (e) {
    if (!e.target || !e.target.isContentEditable) return;
    var raw = '';
    try { raw = (e.clipboardData || window.clipboardData).getData('text/plain') || ''; } catch (err) { raw = ''; }
    e.preventDefault();
    raw = raw.replace(/\s+/g, ' ').trim();
    if (raw) document.execCommand('insertText', false, raw);
  });

  function two(v) { return (v < 10 ? '0' : '') + v; }
  function stamp() {
    var d = new Date();
    return d.getFullYear() + '-' + two(d.getMonth() + 1) + '-' + two(d.getDate()) + ' ' +
           two(d.getHours()) + ':' + two(d.getMinutes());
  }

  function nodeText(id) {
    return (R[id].el.textContent || '')
      .replace(/\u00a0/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  /* тексты по блокам, внутри блока — сверху вниз и слева направо */
  /* одна строка без лишних пробелов — для текстового файла, снимков и проверок */
  function one(v) { return String(v == null ? '' : v).replace(/\s+/g, ' ').trim(); }

  function collect() {
    var groups = framesOut.map(function (f) { return { l: f.l, r: f.r, items: [] }; });
    for (var id in R) {
      if (id.indexOf('bad') === 0 || id.indexOf('good') === 0) continue;   /* смайлики — без текста */
      var cx = R[id].x + R[id].w / 2;
      var best = 0, bestD = Infinity;
      for (var gi = 0; gi < groups.length; gi++) {
        var g = groups[gi];
        var d0 = (cx < g.l) ? (g.l - cx) : (cx > g.r ? cx - g.r : 0);
        if (d0 < bestD) { bestD = d0; best = gi; }
      }
      groups[best].items.push({ x: R[id].x, y: R[id].y, h: R[id].h, t: nodeText(id) });
    }
    var lines = [];
    function byX(a, b) { return (a.x - b.x) || (a.y - b.y); }
    lines.push('Схема пайплайна ИИ-креативов — тексты блоков');
    lines.push('Сохранено: ' + stamp());
    var names = creativeValues();
    lines.push('Номер креатива: ' + (names.length ? names.join(', ') : '—'));
    lines.push('');
    /* профессии, люди и обязанности — одной компактной таблицей */
    var whoAll = nameRows(), anyWho = false;
    for (var wi = 0; wi < whoAll.length; wi++) {
      if (one(whoAll[wi].role) || one(whoAll[wi].person) || one(whoAll[wi].duties)) { anyWho = true; break; }
    }
    if (anyWho) {
      lines.push('Кто за что отвечает:');
      for (var wj = 0; wj < whoAll.length; wj++) {
        var wRole = one(whoAll[wj].role), wMan = one(whoAll[wj].person), wDuty = one(whoAll[wj].duties);
        if (!wRole && !wMan && !wDuty) continue;
        lines.push('  ' + (wRole || '—') + (wMan ? ' — ' + wMan : '')
                   + (wDuty ? ': ' + wDuty : ''));
      }
      lines.push('');
    }
    /* панель отделяем только в том блоке, где она стоит */
    var panelGroup = -1;
    if (panelOut) {
      var pcx = (panelOut.l + panelOut.r) / 2;
      for (var pi = 0; pi < groups.length; pi++) {
        if (pcx >= groups[pi].l && pcx <= groups[pi].r) { panelGroup = pi; break; }
      }
    }
    for (var i = 0; i < groups.length; i++) {
      var items = groups[i].items;
      if (!items.length) continue;
      /* основной ряд и отдельно — персиковая панель (она ниже основного ряда) */
      var usePanel = (panelOut && i === panelGroup);
      var main = [], sub = [];
      for (var q = 0; q < items.length; q++) {
        var cy = items[q].y + items[q].h / 2;
        (usePanel && cy > panelOut.t) ? sub.push(items[q]) : main.push(items[q]);
      }
      main.sort(byX); sub.sort(byX);
      lines.push('Блок ' + (i + 1) + ':');
      for (var j = 0; j < main.length; j++) lines.push('  ' + (main[j].t || '(пусто)'));
      if (sub.length) {
        lines.push('  · панель:');
        for (var j2 = 0; j2 < sub.length; j2++) lines.push('  ' + (sub[j2].t || '(пусто)'));
      }
      lines.push('');
    }
    return lines.join('\r\n');
  }

  var fileName = 'ai-creative-pipeline.txt';

  function saveAsDownload(text) {
    var blob = new Blob(['\ufeff' + text], { type: 'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
    dirty = false;
    toast('Скачано в «Загрузки»: ' + fileName);
  }

  function saveLocal() {
    var text = collect();
    if (!window.showSaveFilePicker) { saveAsDownload(text); return; }
    window.showSaveFilePicker({
      suggestedName: fileName,
      types: [{ description: 'Текстовый документ', accept: { 'text/plain': ['.txt'] } }]
    }).then(function (handle) {
      return handle.createWritable().then(function (w) {
        return w.write(new Blob(['\ufeff' + text], { type: 'text/plain;charset=utf-8' }))
          .then(function () { return w.close(); })
          .then(function () { return handle.name; });
      });
    }).then(function (name) {
      dirty = false;
      toast('Сохранено: ' + name);
    }).catch(function (err) {
      if (err && err.name === 'AbortError') { toast('Отменено: папка не выбрана'); return; }
      saveAsDownload(text);
    });
  }

  /* ---------- 7. сохранение прямо в репозиторий ----------
     Страница статическая: сам браузер в GitHub писать не может, поэтому путей три:
     1) ключ доступа (токен) вставлен один раз и лежит в localStorage ЭТОГО браузера —
        сохранение идёт через GitHub API, работает с любого устройства;
     2) ключа нет — пробуем «почтальона» (01_SCRIPTS\GamesPageSaver.py на 127.0.0.1:8787),
        если он запущен на этой машине;
     3) ничего нет — как раньше: файл скачивается в «Загрузки». ---------- */
  var SAVER = 'http://127.0.0.1:8787';
  var dataFile = 'pipeline-data.json';
  var REPO = 'sg19803/Games_Pipeline';
  var BRANCH = 'main';
  var API = 'https://api.github.com';
  var TOKEN_KEY = 'gh_token_games_pipeline';

  function token() {
    try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; }
  }
  function setToken(v) {
    try {
      if (v) localStorage.setItem(TOKEN_KEY, v);
      else localStorage.removeItem(TOKEN_KEY);
    } catch (e) { /* приватный режим — ключ не запомнится */ }
  }

  /* копия последнего сохранения в этом браузере: страница открывается сразу с ней,
     а файл из репозитория только уточняет — если он новее. Без этого обновление
     страницы сразу после «Сохранить» показывало старый файл (GitHub раздаёт его
     с задержкой), и казалось, что поля не сохранились */
  var LOCAL_KEY = 'gp_snapshot_last';
  function saveLocalSnapshot(snap) {
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(snap)); } catch (e) { /* приватный режим */ }
  }
  function localSnapshot() {
    try {
      var raw = localStorage.getItem(LOCAL_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  /* base64 для UTF-8: btoa сам кириллицу не умеет */
  function b64(str) {
    var bytes = new TextEncoder().encode(str);
    var bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }

  function gh(path, opts) {
    var o = opts || {};
    o.cache = 'no-store';
    o.headers = o.headers || {};
    o.headers['Accept'] = 'application/vnd.github+json';
    o.headers['Authorization'] = 'Bearer ' + token();
    o.headers['X-GitHub-Api-Version'] = '2022-11-28';
    return fetch(API + path, o);
  }

  function snapshot() {
    var nodes = {}, done = {};
    var id, t;
    for (id in R) {
      if (id.indexOf('bad') === 0 || id.indexOf('good') === 0) {
        /* у смайлика нет текста, но его галочка «принято / не принято» запоминается */
        if (R[id].done) done[id] = true;
        continue;
      }
      t = nodeText(id);
      if (t) nodes[id] = t;
      if (R[id].done) done[id] = true;      /* зелёные карточки тоже запоминаем */
    }
    return { version: 1, savedAt: stamp(), creative: creativeValues(),
             names: nameState(), notes: noteValues(), nodes: nodes, done: done };
  }

  function applySnapshot(data) {
    if (!data || !data.nodes) return false;
    var changed = false;
    for (var id in data.nodes) {
      if (!R[id] || id.indexOf('bad') === 0 || id.indexOf('good') === 0) continue;
      var t = String(data.nodes[id] == null ? '' : data.nodes[id])
        .replace(/\s+/g, ' ').trim();
      if (t && nodeText(id) !== t) { setText(id, t); changed = true; }
    }
    /* галочки «сделано» */
    var dn = data.done || {};
    for (var id2 in R) {
      /* у ромба «Утверждение» галочки больше нет — старое значение из снимка пропускаем */
      if (!R[id2].el.querySelector('.chk')) continue;
      var want = !!dn[id2];
      if (!!R[id2].done === want) continue;
      R[id2].done = want;
      R[id2].el.classList.toggle('done', want);
      var cb = R[id2].el.querySelector('.chk');
      if (cb) cb.setAttribute('aria-checked', want ? 'true' : 'false');
      changed = true;
    }
    /* поля «ИМЯ»: если в снимке есть точный вид — восстанавливаем как было,
       вместе с пустыми строками; старые снимки (без names) — по-прежнему:
       первый номер в большое поле, остальные строками ниже */
    var savedNames = (data.names && typeof data.names === 'object') ? data.names : null;
    if (savedNames) {
      var head = String(savedNames.head == null ? '' : savedNames.head);
      /* строки бывают трёх видов: совсем старые — просто название профессии,
         поновее — {role, person}, нынешние — {role, person, duties}.
         Если обязанностей в снимке нет — подставляем готовый текст по профессии */
      var rows = Array.isArray(savedNames.rows) ? savedNames.rows.map(function (v) {
        if (v && typeof v === 'object') {
          var rl = String(v.role == null ? '' : v.role);
          return { role: rl,
                   person: String(v.person == null ? '' : v.person),
                   duties: (v.duties == null ? dutyDefault(rl) : String(v.duties)) };
        }
        var rs = String(v == null ? '' : v);
        return { role: rs, person: '', duties: dutyDefault(rs) };
      }) : [];
      if (cnumEl.value !== head || JSON.stringify(rows) !== JSON.stringify(nameRows())) {
        cnumEl.value = head;
        while (namesEl.firstChild) namesEl.removeChild(namesEl.firstChild);
        for (var r2 = 0; r2 < rows.length; r2++) {
          addRow(rows[r2].role, rows[r2].person, rows[r2].duties);
        }
        ensureRow();
        markShared();
        changed = true;
      }
    } else {
      var want = (data.creative || []).map(function (v) {
        return String(v == null ? '' : v).replace(/\s+/g, ' ').trim();
      }).filter(function (v) { return v; });
      if (JSON.stringify(want) !== JSON.stringify(creativeValues())) {
        cnumEl.value = want.length ? want[0] : '';
        while (namesEl.firstChild) namesEl.removeChild(namesEl.firstChild);
        for (var k = 1; k < want.length; k++) addRow(want[k], '');
        ensureRow();
        markShared();
        changed = true;
      }
    }
    /* заметки блоков: возвращаем в поля по порядку блоков */
    /* заметки блоков: возвращаем в поля по порядку блоков */
    var savedNotes = (data.notes && typeof data.notes === 'object') ? data.notes : null;
    if (savedNotes && notesEl) {
      for (var n2 = 0; n2 < notesEl.children.length; n2++) {
        var wantN = savedNotes[String(n2 + 1)];
        wantN = String(wantN == null ? '' : wantN);
        if (notesEl.children[n2].value !== wantN) {
          notesEl.children[n2].value = wantN;
          changed = true;
        }
      }
    }
    if (changed) { readSheet(); layout(); applyAccess(); }
    return changed;
  }

  function withTimeout(promise, ms, what) {
    return new Promise(function (resolve, reject) {
      var t = setTimeout(function () { reject(new Error(what + ' не ответил за ' + ms + ' мс')); }, ms);
      promise.then(function (v) { clearTimeout(t); resolve(v); },
                   function (e) { clearTimeout(t); reject(e); });
    });
  }


  /* путь 1: GitHub API — один файл pipeline-data.json = один коммит */
  function saveViaGitHub(snap, attempt) {
    attempt = attempt || 0;
    var url = '/repos/' + REPO + '/contents/' + dataFile;
    return gh(url + '?ref=' + BRANCH)
      .then(function (r) {
        if (r.status === 401) throw new Error('ключ не подошёл (401) — нажми «Ключ» и вставь новый');
        if (r.status === 403) throw new Error('ключу не хватает права Contents: Read and write (403)');
        return r.status === 404 ? null : r.json();
      })
      .then(function (cur) {
        var body = {
          message: 'Сохранить со страницы: ' + snap.savedAt,
          content: b64(JSON.stringify(snap, null, 2) + '\n'),
          branch: BRANCH
        };
        if (cur && cur.sha) body.sha = cur.sha;
        return gh(url, { method: 'PUT', body: JSON.stringify(body) });
      })
      .then(function (r) {
        /* 409 — файл успели изменить между чтением и записью: перечитываем и повторяем */
        if (r.status === 409 && attempt < 2) {
          return new Promise(function (res) { setTimeout(res, 1500); })
            .then(function () { return saveViaGitHub(snap, attempt + 1); });
        }
        if (r.ok) {
          return r.json().then(function (res) {
            var sha = res && res.commit && res.commit.sha ? res.commit.sha.slice(0, 7) : '';
            return { ok: true, commit: sha, via: 'github' };
          });
        }
        return r.text().then(function (t) {
          throw new Error('GitHub ' + r.status + ': ' + t.replace(/\s+/g, ' ').slice(0, 90));
        });
      });
  }

  /* путь 2: местный «почтальон» на 127.0.0.1:8787 */
  function saveToSaver(snap, text) {
    return fetch(SAVER + '/save', {
      method: 'POST',
      mode: 'cors',
      cache: 'no-store',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ data: snap, text: text })
    }).then(function (r) {
      return r.text().then(function (raw) {
        var json = null;
        try { json = JSON.parse(raw); } catch (e) { json = null; }
        if (!r.ok || !json || json.ok !== true) {
          var why = (json && (json.error || json.detail)) || ('HTTP ' + r.status);
          throw new Error(String(why));
        }
        json.via = 'saver';
        return json;
      });
    });
  }

  function save() {
    if (!isOwner()) { toast('Только просмотр — сохранять может владелец'); return; }
    /* ключа нет — спрашиваем один раз и сразу сохраняем */
    if (!token()) {
      var typed = window.prompt('Один раз вставь ключ доступа GitHub — дальше кнопка '
        + '«Сохранить» будет писать прямо в репозиторий.', '');
      if (typed && typed.replace(/\s+/g, '')) setToken(typed.replace(/\s+/g, ''));
    }
    var snap = snapshot();
    saveLocalSnapshot(snap);   /* обновление страницы вернёт ровно это */
    var text = collect();
    var p = token() ? saveViaGitHub(snap, 0) : saveToSaver(snap, text);
    withTimeout(p, 20000, 'сохранение').then(function (res) {
      dirty = false;
      toast(res.commit ? 'Сохранено в репозиторий, коммит ' + res.commit
                       : 'Сохранено: изменений не было');
    }).catch(function (err) {
      saveLocal();
      var why = (err && err.message) ? String(err.message) : 'нет ответа';
      if (/401|403/.test(why)) setToken('');
      toast('В репозиторий не ушло (' + why.slice(0, 60) + '). Файл скачан в «Загрузки».');
    });
  }

  /* ---------- 7б. кто хозяин, а кто просто смотрит ----------
     Страница открыта всем — смотреть может любой.
     Сохранять и править может только владелец: запись в репозиторий без его ключа
     невозможна в принципе (ключ лежит только в его браузере), а кнопки посторонним
     незачем видеть. Владелец один раз открывает адрес с «?owner=1» — это
     запоминается в его браузере; дальше достаточно ключа.
     Гость получает тот же лист, но ни одного редактируемого поля. */
  var OWNER_FLAG = 'gp_owner';
  function isOwner() {
    try {
      if (/[?&]owner=1(&|#|$)/.test(location.search)) {
        localStorage.setItem(OWNER_FLAG, '1');
        return true;
      }
      if (localStorage.getItem(OWNER_FLAG) === '1') return true;
    } catch (e) { /* приватный режим браузера — остаётся проверка ключа */ }
    return !!token();
  }
  var OWNER = isOwner();

  /* выключаем всё, чем можно что-то изменить; кнопки «Сохранить»/«Ключ» — только хозяину */
  function applyAccess() {
    document.body.classList.toggle('guest', !OWNER);
    var bar = document.getElementById('savebar');
    if (bar) bar.hidden = !OWNER;
    if (OWNER) {
      var old = document.querySelector('.guestbadge');
      if (old && old.parentNode) old.parentNode.removeChild(old);
      return;
    }
    var f = document.querySelectorAll('#cnum, #names .ninput, #names .nperson, #names .ndtext, #notes textarea');
    for (var i = 0; i < f.length; i++) f[i].readOnly = true;
    var ed = document.querySelectorAll('[contenteditable="true"]');
    for (i = 0; i < ed.length; i++) ed[i].setAttribute('contenteditable', 'false');
    if (!document.querySelector('.guestbadge')) {
      var badge = document.createElement('div');
      badge.className = 'guestbadge';
      badge.textContent = 'Только просмотр — менять и сохранять может владелец';
      document.body.appendChild(badge);
    }
  }
  applyAccess();

  document.getElementById('save').addEventListener('click', save);

  /* ключ лежит только в этом браузере и в файлы репозитория не попадает */
  var keyBtn = document.getElementById('key');
  if (keyBtn) {
    keyBtn.addEventListener('click', function () {
      if (!isOwner()) return;
      var cur = token();
      var hint = cur
        ? 'Ключ уже сохранён в этом браузере.\nВставь новый ключ или оставь пусто и нажми OK — ключ удалится.'
        : 'Вставь ключ доступа GitHub (создаётся один раз: Settings → Developer settings → Tokens).';
      var v = window.prompt(hint, '');
      if (v === null) return;
      v = v.replace(/\s+/g, '');
      if (v) { setToken(v); toast('Ключ сохранён в этом браузере'); keyBtn.title = 'Ключ есть'; }
      else if (cur) { setToken(''); toast('Ключ удалён из этого браузера'); keyBtn.title = 'Вставить ключ'; }
    });
    keyBtn.title = token() ? 'Ключ есть — сохранение идёт в репозиторий' : 'Вставить ключ доступа';
  }

  /* при открытии подхватываем сохранение: сначала свою копию из этого браузера,
     затем файл из репозитория — но только если он новее */
  var localSnap = localSnapshot();
  function bootRestore() {
    if (localSnap && applySnapshot(localSnap)) dirty = false;
    fetch(dataFile + '?v=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (data) {
        if (!data) return;
        /* в браузере копия свежее — не затираем её старым файлом с GitHub */
        if (localSnap && String(localSnap.savedAt || '') > String(data.savedAt || '')) return;
        if (applySnapshot(data)) {
          dirty = false;
          toast('Загружены сохранённые тексты: ' + (data.savedAt || ''));
        }
      })
      .catch(function () { /* файла нет или страница открыта локально */ });
  }

  /* ---------- 4в. кто отвечает за карточку: подсветка строк сверху ----------
     На макете у каждой карточки стоит цифра — это номер строки в списке профессий
     (1 трафик менеджер, 2 ИИ артист, 3 саунд артист, 4 геймплэй артист, 5 режиссер,
     6 режиссер монтажа, 7 ответственный за задачу, 8 композитинг артист, 9 VFX артист,
     10 контент менеджер). На самой странице цифры не показываем: связь нужна только
     для подсветки — держишь мышку на карточке, сверху подсвечиваются строки тех,
     кто за неё отвечает; убрал мышку — подсветка пропала. */
  var ROLE_BY_NUM = {
    1: 'трафик менеджер',           2: 'ии артист',
    3: 'саунд артист',              4: 'геймплэй артист',
    5: 'режиссер',                  6: 'режиссер монтажа',
    7: 'ответственный за задачу',   8: 'композитинг артист',
    9: 'vfx артист',               10: 'контент менеджер'
  };
  /* карточка → номера профессий; у карточки их может быть две */
  var NODE_ROLES = {
    in: [1], b1: [1], b2: [10],
    scen: [5], v20: [5],
    txt: [2, 4],                       /* опорные кадры: ИИ артист или запись геймплея */
    mus0: [3], mont: [6],
    p1: [2], p2: [2], p3: [2], gmp: [4],
    d1: [7], d2: [7],                  /* «Утверждение» держит ответственный за задачу */
    bad1: [7], good1: [7], bad2: [7], good2: [7],
    vid: [2], comp: [8, 9], mus: [3], fin: [4],
    sved: [6], color: [6], master: [3], fmont: [6],
    topj: [6], out: [1]
  };

  /* профессия из строки → её номер. «ё» и дефисы уже приведены к одному виду в dutyKey,
     здесь добавлены только частые варианты написания */
  function roleNum(text) {
    var k = dutyKey(text)
      .replace(/геймплей/g, 'геймплэй')
      .replace(/ответственный за задачи/g, 'ответственный за задачу')
      .replace(/ответсвенный/g, 'ответственный');
    for (var n in ROLE_BY_NUM) if (ROLE_BY_NUM[n] === k) return Number(n);
    return 0;
  }

  var hlRows = [];
  function rolesOff() {
    for (var i = 0; i < hlRows.length; i++) hlRows[i].classList.remove('hl');
    hlRows = [];
  }
  /* мышка на карточке — подсветка строк; строк может быть две (например 8 и 9) */
  function rolesOn(id) {
    rolesOff();
    var nums = NODE_ROLES[id] || [];
    if (!nums.length) return 0;
    var rows = namesEl.querySelectorAll('.nrow');
    for (var i = 0; i < rows.length; i++) {
      var inp = rows[i].querySelector('.ninput');
      var n = roleNum(inp ? inp.value : '');
      if (nums.indexOf(n) !== -1) { rows[i].classList.add('hl'); hlRows.push(rows[i]); }
    }
    return hlRows.length;
  }
  function bindRoles() {
    for (var id in NODE_ROLES) {
      (function (nid) {
        var el = R[nid] && R[nid].el;
        if (!el || el.__rolesBound) return;
        el.__rolesBound = true;
        el.addEventListener('mouseenter', function () { rolesOn(nid); });
        el.addEventListener('mouseleave', rolesOff);
      })(id);
    }
  }
  bindRoles();

  /* отладочный крючок — для проверки сборки снаружи */
  window.__pipeline = {
    build: '2026-11-07-1 (setka-8pt)',
    layout: layout,
    collect: collect,
    snapshot: snapshot,
    applySnapshot: applySnapshot,
    people: personGroups,
    rows: nameRows,
    dutyDefault: dutyDefault,
    set: function (id, text) { if (R[id]) { setText(id, text); readSheet(); layout(); } },
    setDone: function (id, on) { setDone(id, on); dirty = false; },
    rect: function (id) {
      if (!R[id]) return null;
      var r = R[id].el.getBoundingClientRect();
      return { x: R[id].x, y: R[id].y, w: R[id].w, h: R[id].h,
               sw: R[id].el.scrollWidth, sh: R[id].el.scrollHeight,
               cw: R[id].el.clientWidth, ch: R[id].el.clientHeight,
               done: !!R[id].done, text: nodeText(id) };
    },
    ids: function () { return Object.keys(R); },
    nodeRoles: NODE_ROLES,
    roleNum: roleNum,
    roles: rolesOn,
    rolesOff: rolesOff,
    save: save,
    download: function () { saveAsDownload(collect()); }
  };

  /* первая сборка схемы */
  layout();
  /* гость/хозяин: до первого показа выключаем всё, чем можно что-то изменить */
  applyAccess();
  /* и только теперь подхватываем сохранение: поля заметок уже созданы */
  bootRestore();






})();

</script>
</body>
