/* ---- стекло: те же переменные, что на основной странице ---- */
:root{
  --gl-ink:#33363b; --gl-ink2:#5b5f65; --gl-ink3:#7f8388;
  --gl-blue:#3f6fae; --gl-red:#e0443c; --gl-green:#2fae5c;
  --gl-ts:0 1px 1.5px rgba(30,36,42,.22);
  --gl-tint:linear-gradient(180deg, rgba(30,40,50,.075) 0%, rgba(30,40,50,.06) 60%, rgba(30,40,50,.035) 100%);
  --gl-rim:
    inset 0 1px 0 rgba(255,255,255,.62), inset 0 4px 4px -2px rgba(50,60,70,.20),
    inset 0 -2px 1px -1px rgba(255,255,255,.95), inset 0 -6px 7px -3px rgba(255,255,255,.55),
    inset 3px 0 4px -3px rgba(255,255,255,.45), inset -3px 0 4px -3px rgba(255,255,255,.45),
    0 0 0 1px rgba(104,112,120,.42);
  --gl-rimThin:
    inset 0 1px 0 rgba(255,255,255,.55), inset 0 -1px 0 rgba(255,255,255,.45),
    inset 0 2px 3px -2px rgba(50,60,70,.14), 0 0 0 1px rgba(104,112,120,.30);
  --gl-e3:var(--gl-rimThin), 0 1px 2px rgba(55,63,71,.14), 0 4px 8px rgba(55,63,71,.09);
  --gl-e4:var(--gl-rim), 0 2px 2px rgba(55,63,71,.22), 0 6px 12px rgba(55,63,71,.16);
  --gl-e5:var(--gl-rim), 0 0 0 1px rgba(104,112,120,.5), 0 4px 6px rgba(55,63,71,.22), 0 14px 26px rgba(55,63,71,.22);
  --gl-greenFill:linear-gradient(0deg, rgba(55,175,100,.50) 0%, rgba(55,175,100,.22) 40%, rgba(55,175,100,0) 85%), var(--gl-tint);
  --gl-greenRim:
    inset 0 1px 0 rgba(255,255,255,.75), inset 0 4px 4px -2px rgba(20,70,40,.22),
    inset 0 -2px 1px -1px rgba(225,255,235,.95), inset 0 -7px 9px -3px rgba(190,255,215,.55),
    0 0 0 1px rgba(30,110,60,.45);
  --gl-blueRim:
    inset 1px 1px 0 rgba(255,255,255,.8), inset 3px 3px 4px -2px rgba(20,50,110,.22),
    inset -2px -2px 1px -1px rgba(220,238,255,.95), inset -7px -7px 9px -4px rgba(180,215,255,.5),
    0 0 0 1px rgba(40,90,170,.45);
  --sheetBg:
    radial-gradient(900px 520px at 100% 0%, rgba(90,185,212,.30), rgba(90,185,212,.10) 45%, transparent 72%),
    radial-gradient(700px 420px at 0% 100%, rgba(30,95,115,.14), transparent 70%),
    linear-gradient(180deg, #ced2d6 0%, #c4c8cc 55%, #b9bdc2 100%);
  --sheetShadow:inset 0 0 0 1px rgba(255,255,255,.55), inset -2px 2px 0 rgba(140,220,240,.45),
    0 10px 20px rgba(0,0,0,.35), 0 30px 60px rgba(0,0,0,.45);
  --safeB:env(safe-area-inset-bottom, 0px);
  --safeT:env(safe-area-inset-top, 0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; min-height:100%}
body{
  font-family:"InterPage","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; font-optical-sizing:auto;
  font-size:17px; line-height:25px; letter-spacing:-.022em; color:var(--gl-ink);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  background:
    radial-gradient(700px 520px at 100% -10%, rgba(78,168,196,.85), rgba(40,110,135,.35) 45%, transparent 75%),
    radial-gradient(600px 480px at 0% 110%, rgba(20,70,88,.55), transparent 65%),
    linear-gradient(160deg, #0b1c22 0%, #050d11 55%, #020507 100%) fixed;
  background-color:#050d11;
  overscroll-behavior-y:none;
}
html.apple body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","InterPage",sans-serif}
button{font:inherit; color:inherit; border:0; background:none; padding:0; cursor:pointer}

/* ---- верхняя строка ---- */
.top{position:sticky; top:0; z-index:20; padding:calc(10px + var(--safeT)) 16px 10px;
  display:flex; align-items:center; gap:12px;
  background:linear-gradient(180deg, rgba(5,13,17,.86), rgba(5,13,17,.62));
  -webkit-backdrop-filter:blur(20px) saturate(160%); backdrop-filter:blur(20px) saturate(160%);
  box-shadow:0 1px 0 rgba(255,255,255,.06)}
.top h1{flex:1 1 auto; margin:0; font-size:17px; line-height:22px; font-weight:600; letter-spacing:-.022em; color:#e9eef1;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.flags{display:flex; gap:4px; flex:0 0 auto}
.flags button{width:24px; height:16px; display:block}
.flags svg{display:block; width:24px; height:16px}
.flags button:not(.on){opacity:.55}

.screen{display:none; padding:12px 12px calc(110px + var(--safeB))}
.screen.on{display:block}
.hint{color:#9fb3bb; font-size:14px; line-height:19px; letter-spacing:-.016em; margin:4px 6px 14px}

/* ---- лист схемы: этапы сверху вниз ---- */
.schema{position:relative}
body.bsOpen #scr-schema{padding-bottom:54vh}
.retl{position:absolute; inset:0; pointer-events:none; overflow:visible; z-index:3}
.retl path{fill:none; stroke:var(--gl-red); stroke-width:1.5}
.stage{position:relative; margin:0 0 14px 14px; border-radius:22px; padding:14px 12px 14px;
  background:var(--sheetBg); box-shadow:var(--sheetShadow)}
.stHead{display:flex; align-items:baseline; gap:10px; margin:0 4px 4px}
.stNum{flex:0 0 auto; font-size:12px; line-height:16px; font-weight:600; letter-spacing:.06em; color:#2a6f86}
.stTitle{font-size:20px; line-height:24px; font-weight:600; letter-spacing:-.02em; color:#1f2428; margin:0}
.stNote{font-size:14px; line-height:19px; letter-spacing:-.016em; color:var(--gl-ink2); margin:2px 4px 12px}
.row{display:grid; grid-template-columns:repeat(var(--n,1), minmax(0,1fr)); gap:8px}
.row.c2{grid-template-columns:1fr 1fr}
.join{height:22px; display:flex; justify-content:center; align-items:center}
.join svg{width:12px; height:22px}
.join path{fill:none; stroke:var(--gl-blue); stroke-width:1.5}
.join .hd{fill:var(--gl-blue); stroke:none}

/* карточка шага — то же стекло, что на основной странице */
.step{position:relative; min-height:58px; border-radius:14px; padding:10px 12px 9px 28px;
  display:flex; flex-direction:column; justify-content:center; text-align:left;
  background:var(--tintbg, none), var(--gl-tint); box-shadow:var(--gl-e4);
  transition:box-shadow .2s ease, transform .15s ease}
.step:active{transform:scale(.98)}
.step .t{font-size:15px; line-height:19px; letter-spacing:-.018em; color:var(--gl-ink); text-shadow:var(--gl-ts); font-weight:500}
.step .w{margin-top:3px; font-size:12px; line-height:15px; letter-spacing:-.01em; color:var(--gl-ink2); display:flex; flex-wrap:wrap; gap:2px 8px}
.step .w i{font-style:normal; display:inline-flex; align-items:center; gap:4px}
.step .w i::before{content:""; width:7px; height:7px; border-radius:50%; background:hsl(var(--h),70%,52%); box-shadow:0 0 0 1px rgba(255,255,255,.6)}
.chk{position:absolute; left:8px; top:10px; width:14px; height:14px; border-radius:50%;
  background:rgba(255,255,255,.55); box-shadow:inset 0 0 0 1px rgba(104,112,120,.45); display:flex; align-items:center; justify-content:center}
.chk::after{content:""; position:absolute; inset:-12px}         /* палец попадает легко */
.chk svg{width:10px; height:10px; opacity:0}
.chk path{fill:none; stroke:#fff; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round}
.step.done{background:linear-gradient(0deg, rgba(55,175,100,.50) 0%, rgba(55,175,100,.22) 40%, rgba(55,175,100,0) 85%), var(--gl-tint);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.75), 0 0 0 1px rgba(30,110,60,.45), 0 4px 10px rgba(30,110,60,.22)}
.step.done .chk{background:var(--gl-green); box-shadow:0 0 0 1px rgba(30,110,60,.6)}
.step.done .chk svg{opacity:1}
.step.key{background:var(--gl-greenFill); box-shadow:var(--gl-greenRim), 0 2px 3px rgba(20,70,40,.30), 0 8px 18px rgba(25,90,50,.28)}
.step.key .t{color:#185a33; font-weight:600; letter-spacing:.04em; text-align:center}
.step.key{align-items:center; padding-left:12px}
.step.key .w{justify-content:center}

/* выбранный шаг и связанные с ним — цветом исполнителя */
.step.sel{box-shadow:var(--gl-e5), 0 0 0 2px hsla(var(--ph),70%,48%,.85), 0 0 26px hsla(var(--ph),90%,60%,.7)}
.step.rel{box-shadow:var(--gl-e4), 0 0 0 1.5px hsla(var(--ph),70%,48%,.6), 0 0 16px hsla(var(--ph),90%,60%,.45)}
.step.flow{box-shadow:var(--gl-e4), 0 0 0 1.5px rgba(63,111,174,.55), 0 0 14px rgba(90,160,255,.35)}

/* подложки опорных кадров — как на основной: персиковая и голубая */
.sub{margin-top:8px; border-radius:16px; padding:10px 8px 8px}
.sub.peach{background:linear-gradient(180deg, rgba(200,140,80,.13), rgba(200,140,80,.06)); box-shadow:var(--gl-rimThin)}
.sub.blue{background:linear-gradient(180deg, rgba(90,140,220,.14), rgba(90,140,220,.06)); box-shadow:var(--gl-rimThin)}
.subT{font-size:12px; line-height:16px; color:var(--gl-ink2); margin:0 4px 8px; letter-spacing:-.01em}
.subs{display:grid; grid-template-columns:1fr; gap:8px}

/* утверждение: ромб и два исхода */
.gate{display:flex; flex-direction:column; align-items:center; gap:12px; padding:6px 0 2px}
.dia{width:96px; height:96px; position:relative; display:flex; align-items:center; justify-content:center}
.dia i{position:absolute; inset:14px; border-radius:12px; transform:rotate(45deg);
  background:linear-gradient(-45deg, rgba(70,135,225,.55) 0%, rgba(70,135,225,.24) 42%, rgba(70,135,225,0) 88%), var(--gl-tint);
  box-shadow:var(--gl-blueRim), 0 4px 8px rgba(30,60,110,.22), 0 10px 22px rgba(30,60,110,.18), 0 0 18px rgba(90,160,255,.30)}
.dia b{position:relative; font-size:10px; line-height:12px; font-weight:600; letter-spacing:.06em; color:#174a8c; text-align:center}
.dia.sel i{box-shadow:var(--gl-blueRim), 0 0 0 2px hsla(var(--ph),70%,48%,.85), 0 0 26px hsla(var(--ph),90%,60%,.7)}
.outs{display:grid; grid-template-columns:1fr 1fr; gap:8px; width:100%}
.out{border-radius:14px; padding:9px 10px 9px 40px; position:relative; text-align:left; font-size:13px; line-height:17px; letter-spacing:-.01em; box-shadow:var(--gl-e4); background:var(--gl-tint)}
.out .sm{position:absolute; left:8px; top:50%; margin-top:-13px; width:26px; height:26px; border-radius:50%; background:rgba(255,255,255,.5)}
.out.good .sm{box-shadow:inset 0 0 0 1.5px var(--gl-green)} .out.bad .sm{box-shadow:inset 0 0 0 1.5px var(--gl-red)}
.out svg{position:absolute; left:8px; top:50%; margin-top:-13px; width:26px; height:26px}
.out b{display:block; font-weight:600}
.out.good b{color:#1f7a44} .out.bad b{color:#b8322b}

/* ---- общий список (команда, программы, папки) ---- */
.panel{border-radius:22px; padding:8px; background:var(--sheetBg); box-shadow:var(--sheetShadow); margin-bottom:14px}
.li{display:flex; align-items:center; gap:12px; width:100%; min-height:52px; padding:8px 10px; border-radius:14px; text-align:left}
.li + .li{margin-top:2px}
.li:active{background:rgba(255,255,255,.3)}
.li .ic{flex:0 0 32px; width:32px; height:32px; display:flex; align-items:center; justify-content:center}
.li .ic img{width:30px; height:30px; filter:drop-shadow(0 1px 2px rgba(0,0,0,.22))}
.li .dot{width:14px; height:14px; border-radius:50%; background:hsl(var(--h),70%,52%); box-shadow:0 0 0 2px rgba(255,255,255,.65), 0 0 12px hsla(var(--h),90%,60%,.5)}
.li .tx{flex:1 1 auto; min-width:0}
.li .a{display:block; font-size:16px; line-height:21px; font-weight:500; color:var(--gl-ink); letter-spacing:-.02em}
.li .b{display:block; font-size:13px; line-height:17px; color:var(--gl-ink2); letter-spacing:-.01em}
.li .chev{flex:0 0 auto; color:var(--gl-ink3)}
.pp{flex:0 0 auto; font-size:12px; line-height:16px; padding:2px 8px; border-radius:999px; box-shadow:inset 0 1px 0 rgba(255,255,255,.55)}
.pp.free{color:#1d6b3c; background:rgba(60,175,105,.16)} .pp.paid{color:#8a5512; background:rgba(230,160,40,.2)}
.sumTitle{font-size:22px; line-height:27px; font-weight:600; letter-spacing:-.02em; color:#1f2428; margin:8px 10px 2px}
.sumText{font-size:14px; line-height:19px; color:var(--gl-ink2); margin:0 10px 8px}

/* дерево папок для пальца: строки выше, чем на компьютере */
.trow{display:flex; align-items:center; gap:8px; min-height:42px; padding:0 8px 0 calc(6px + var(--d,0) * 18px); border-radius:12px; width:100%; text-align:left; font-size:15px; letter-spacing:-.018em}
.trow:active{background:rgba(255,255,255,.3)}
.trow .tchev{flex:0 0 22px; height:22px; display:flex; align-items:center; justify-content:center; color:var(--gl-ink3)}
.trow .tchev svg{width:10px; height:10px; transition:transform .2s ease}
.trow.open .tchev svg{transform:rotate(90deg)}
.trow:not(.has) .tchev{visibility:hidden}
.trow .tico{flex:0 0 22px; width:22px; height:18px}
.trow .nm{flex:1 1 auto}
.trow .more{flex:0 0 auto; color:var(--gl-ink3); padding:0 4px}
.tkids[hidden]{display:none}

/* ---- нижняя панель вкладок ---- */
.tabs{position:fixed; left:12px; right:12px; bottom:calc(10px + var(--safeB)); z-index:30; height:64px;
  display:grid; grid-template-columns:repeat(4,1fr); border-radius:24px; padding:6px;
  background:linear-gradient(180deg, rgba(30,46,54,.78), rgba(12,24,30,.86));
  -webkit-backdrop-filter:blur(22px) saturate(170%); backdrop-filter:blur(22px) saturate(170%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14), inset 0 0 0 1px rgba(255,255,255,.07), 0 10px 30px rgba(0,0,0,.45)}
.tab{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; border-radius:18px; color:#8fa3ab; font-size:11px; line-height:13px; letter-spacing:-.005em}
.tab svg{width:24px; height:24px}
.tab svg *{fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.tab.on{color:#fff; background:linear-gradient(180deg, rgba(120,175,240,.38), rgba(70,125,200,.28)); box-shadow:inset 0 1px 0 rgba(255,255,255,.3), 0 0 0 1px rgba(110,165,235,.35), 0 0 18px rgba(90,160,255,.35)}

/* ---- выезжающая снизу карточка ---- */
.scrim{position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.35); opacity:0; pointer-events:none; transition:opacity .3s ease}
.scrim.on{opacity:1; pointer-events:auto}
.scrim{background:rgba(0,0,0,.16)}
.schema.focus .step:not(.sel):not(.rel):not(.flow), .schema.focus .dia:not(.sel):not(.rel):not(.flow){opacity:.42; filter:saturate(.6); transition:opacity .25s ease, filter .25s ease}
.schema .step, .schema .dia{transition:opacity .25s ease, filter .25s ease}
.bs{position:fixed; left:0; right:0; bottom:0; z-index:50; max-height:52vh; display:flex; flex-direction:column;
  border-radius:26px 26px 0 0; background:var(--sheetBg); box-shadow:var(--sheetShadow), 0 -10px 40px rgba(0,0,0,.4);
  transform:translateY(105%); transition:transform .42s cubic-bezier(.2,.9,.25,1); will-change:transform; padding-bottom:var(--safeB)}
.bs.on{transform:translateY(0)}
.bs.drag{transition:none}
.bsGrab{flex:0 0 auto; padding:8px 0 2px; display:flex; justify-content:center; touch-action:none}
.bsGrab i{width:38px; height:5px; border-radius:3px; background:rgba(60,70,80,.35)}
.bsHead{flex:0 0 auto; display:flex; align-items:center; gap:6px; padding:2px 10px 8px; touch-action:none}
.bsHead h2{flex:1 1 auto; margin:0; font-size:20px; line-height:25px; font-weight:600; letter-spacing:-.02em; color:#1f2428}
.bsBtn{flex:0 0 auto; width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--gl-ink2); background:rgba(255,255,255,.35); box-shadow:var(--gl-rimThin)}
.bsBtn svg{width:16px; height:16px} .bsBtn svg *{fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.bsBtn[hidden]{display:none}
.bsBody{flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 14px 18px; overscroll-behavior:contain}
.sec{margin:14px 2px 6px; font-size:12px; line-height:16px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:#2a6f86}
.txt{font-size:15px; line-height:21px; letter-spacing:-.018em; color:var(--gl-ink); margin:4px 2px 0}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{display:inline-flex; align-items:center; gap:6px; min-height:34px; padding:6px 12px; border-radius:999px; font-size:14px; line-height:18px; letter-spacing:-.016em;
  background:rgba(255,255,255,.38); box-shadow:inset 0 1px 0 rgba(255,255,255,.7), 0 0 0 1px rgba(80,90,100,.14); text-align:left}
.chip:active{background:rgba(255,255,255,.6)}
.chip .d{width:9px; height:9px; border-radius:50%; background:hsl(var(--h),70%,52%)}
.chip img{width:18px; height:18px}
.chip.red{color:#b8322b} .chip.green{color:#1f7a44}
.shot{display:block; margin:6px 0 4px; border-radius:14px; overflow:hidden; box-shadow:0 0 0 1px rgba(40,50,60,.18), 0 8px 18px rgba(30,40,50,.25)}
.shot img{display:block; width:100%; height:auto}
.price{display:inline-block; margin-top:8px; font-size:15px; line-height:21px; padding:8px 12px; border-radius:14px; box-shadow:inset 0 1px 0 rgba(255,255,255,.6), 0 0 0 1px rgba(80,90,100,.12)}
.price.free{color:#195f35; background:rgba(60,175,105,.16)} .price.paid{color:#7c4c0e; background:rgba(230,160,40,.18)}
.who{font-weight:600}
.link{display:inline-block; margin-top:12px; font-size:17px; line-height:25px; color:#0066cc; text-decoration:none}
.bigIco{display:flex; align-items:center; gap:12px; margin:2px 2px 4px}
.bigIco img{width:52px; height:52px; filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}
.bigIco .c{font-size:14px; line-height:18px; color:var(--gl-ink2)}

@media (prefers-reduced-motion: reduce){ .bs{transition:none} }


/* ---- карта пайплайна ---- */
.map{position:relative; margin:4px 0 0}
.mband{position:absolute; border-radius:16px; background:var(--sheetBg); box-shadow:var(--sheetShadow)}
.mhead{position:absolute; z-index:2; padding:0 8px 0 2px; border-radius:11px; background:rgba(200,214,220,.96); box-shadow:0 0 0 2px rgba(200,214,220,.96); display:flex; align-items:center; gap:6px; height:20px; font-size:11px; line-height:14px; font-weight:600; letter-spacing:.02em; text-transform:uppercase; color:#2f6f82}
.mhead b{display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px; border-radius:50%; background:rgba(47,111,130,.16); font-size:11px}
.mhead i{display:flex; color:#6f8f99} .mhead i svg{width:6px; height:10px}
.mlbl{position:absolute; font-size:9px; line-height:11px; font-weight:600; color:#5a6a72; letter-spacing:.02em; text-transform:uppercase; pointer-events:none}
.mlbl.r{color:#c0392b} .mlbl.g{color:#1f7a44}
.medges{position:absolute; left:0; top:0; overflow:visible; pointer-events:none}
.me .ln{fill:none; stroke:#3f6fae; stroke-width:1.6; stroke-linejoin:round}
.me .hd{fill:#3f6fae}
.me.g .ln{stroke:#2fae5c} .me.g .hd{fill:#2fae5c}
.me.b .ln{stroke:#e0443c; stroke-width:2} .me.b .hd{fill:#e0443c}
.me{transition:opacity .25s ease}
.schema.focus .me:not(.hot){opacity:.18}
.me.hot .ln{stroke-width:2.6} .me.hot{filter:drop-shadow(0 0 3px rgba(90,160,255,.7))}
.me.b.hot{filter:drop-shadow(0 0 3px rgba(240,80,70,.7))} .me.g.hot{filter:drop-shadow(0 0 3px rgba(60,200,110,.7))}
.mn{position:absolute; display:flex; align-items:center; justify-content:center; padding:2px 6px; border-radius:9px; text-align:center;
  background:var(--tintbg, none), var(--gl-tint); box-shadow:var(--gl-e4); color:#23292d; transition:opacity .25s ease, filter .25s ease, box-shadow .25s ease}
.mn .t{display:block; min-width:0; font-size:10px; line-height:12px; font-weight:500; letter-spacing:-.01em; overflow:hidden}
.mn .dots{position:absolute; right:3px; top:2px; display:flex; gap:2px}
.mn .dots i{width:5px; height:5px; border-radius:50%; background:hsl(var(--h),75%,52%); box-shadow:0 0 0 1px rgba(255,255,255,.7)}
.mn.key{background:var(--gl-greenFill); color:#1b5e36}
.mn.key .t{font-weight:700; letter-spacing:.04em; text-transform:uppercase; font-size:10.5px}
.mn.peach{background:linear-gradient(180deg, rgba(200,140,80,.22), rgba(200,140,80,.08)), var(--gl-tint)}
.mn.blue{background:linear-gradient(180deg, rgba(90,140,220,.24), rgba(90,140,220,.08)), var(--gl-tint)}
.mn.done{background:linear-gradient(0deg, rgba(55,175,100,.50) 0%, rgba(55,175,100,.22) 40%, rgba(55,175,100,0) 85%), var(--gl-tint)}
.mn.sel{box-shadow:var(--gl-e4), 0 0 0 2px hsla(var(--ph),70%,48%,.9), 0 0 18px hsla(var(--ph),90%,60%,.7)}
.mn.rel{box-shadow:var(--gl-e4), 0 0 0 1.5px hsla(var(--ph),70%,48%,.65), 0 0 14px hsla(var(--ph),90%,60%,.45)}
.mn.flow{box-shadow:var(--gl-e4), 0 0 0 1.5px rgba(63,111,174,.6), 0 0 12px rgba(90,160,255,.4)}
.schema.focus .mn:not(.sel):not(.rel):not(.flow), .schema.focus .mdia:not(.sel):not(.rel):not(.flow){opacity:.35; filter:saturate(.5)}
.mdia{position:absolute; display:block}
.mdia i{position:absolute; inset:8px; transform:rotate(45deg); border-radius:9px;
  background:linear-gradient(-45deg, rgba(70,135,225,.55) 0%, rgba(70,135,225,.24) 42%, rgba(70,135,225,0) 88%), var(--gl-tint); box-shadow:var(--gl-e4)}
.mdia.sel i{box-shadow:var(--gl-e4), 0 0 0 2px rgba(63,111,174,.9), 0 0 18px rgba(90,160,255,.7)}
.mdia.flow i{box-shadow:var(--gl-e4), 0 0 0 1.5px rgba(63,111,174,.6), 0 0 12px rgba(90,160,255,.4)}
.mdia.rel i{box-shadow:var(--gl-e4), 0 0 0 1.5px hsla(var(--ph),70%,48%,.65), 0 0 14px hsla(var(--ph),90%,60%,.45)}
.doneBtn{display:inline-flex; align-items:center; gap:8px; margin:2px 0 6px; padding:8px 14px 8px 10px; border-radius:999px; font-size:15px;
  background:rgba(255,255,255,.4); box-shadow:var(--gl-rimThin); color:#2a3237}
.doneBtn svg{width:18px; height:18px; border-radius:50%; background:rgba(255,255,255,.7); box-shadow:inset 0 0 0 1.5px rgba(80,90,100,.35)}
.doneBtn svg path{fill:none; stroke:transparent; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round}
.doneBtn.on{background:rgba(55,175,100,.22); color:#1b5e36}
.doneBtn.on svg{background:#2fae5c; box-shadow:none} .doneBtn.on svg path{stroke:#fff}

/* ---- лупа: маленькая стоит сверху справа; коснулся — выросла, тащишь пальцем; красный крестик — обратно ---- */
.mlens{position:fixed; left:0; top:0; z-index:35; width:var(--L); height:var(--L); margin:calc(var(--L) / -2) 0 0 calc(var(--L) / -2);
  border-radius:50%; touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; will-change:transform}
.mlView{position:absolute; inset:0; border-radius:50%; overflow:hidden; isolation:isolate; background:#050d11; filter:url(#mLensWarp);
  -webkit-mask-image:radial-gradient(circle closest-side, #000 99%, transparent 100%); mask-image:radial-gradient(circle closest-side, #000 99%, transparent 100%)}
.mlCh{position:absolute; inset:0; overflow:hidden; isolation:isolate; background:#050d11}
.mlCh > i{position:absolute; inset:0; z-index:2; mix-blend-mode:multiply}
.mlR > i{background:#f00} .mlG > i{background:#0f0} .mlB > i{background:#00f}
.mlG, .mlB{mix-blend-mode:screen}
.mlSrc{position:absolute; left:0; top:0; transform-origin:0 0; will-change:auto !important;
  font-size:17px; line-height:25px; letter-spacing:-.022em; color:var(--gl-ink); text-align:left; font-weight:400;
  background:radial-gradient(700px 520px at 100% -10%, rgba(78,168,196,.85), rgba(40,110,135,.35) 45%, transparent 75%), linear-gradient(160deg, #0b1c22 0%, #050d11 55%, #020507 100%);
  background-repeat:no-repeat; background-color:#050d11}
.mlSrc *{transition:none !important; animation:none !important; -webkit-backdrop-filter:none !important; backdrop-filter:none !important; will-change:auto !important}
.mlRim{position:absolute; inset:0; border-radius:50%; pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.55), inset 0 2px 1px rgba(255,255,255,.55),
             inset 0 -10px 24px rgba(0,0,0,.18), inset 0 10px 30px rgba(255,255,255,.18),
             0 0 0 1px rgba(20,30,40,.18), 0 10px 24px rgba(0,0,0,.28), 0 24px 60px rgba(0,0,0,.22);
  background:radial-gradient(120% 90% at 30% 15%, rgba(255,255,255,.22), transparent 45%)}
.mlIcon{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; transition:opacity .2s ease}
.mlIcon svg{width:42%; height:42%; filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
.mlIcon svg *{fill:none; stroke:#fff; stroke-width:2.2; stroke-linecap:round}
.mlens.big .mlIcon{opacity:0}
.mlens:not(.big) .mlRim{box-shadow:inset 0 0 0 2px rgba(255,255,255,.7), 0 0 0 2px rgba(90,160,255,.55), 0 0 22px rgba(90,160,255,.55), 0 8px 18px rgba(0,0,0,.4)}
.mlX{position:fixed; left:0; top:0; z-index:36; width:30px; height:30px; margin:-15px 0 0 -15px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #ff7a70, #e0443c 55%, #b8322b); box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 0 0 1.5px rgba(255,255,255,.85), 0 4px 10px rgba(0,0,0,.35);
  display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity .2s ease}
.mlX.on{opacity:1; pointer-events:auto}
.mlX svg{width:12px; height:12px} .mlX svg *{fill:none; stroke:#fff; stroke-width:2.4; stroke-linecap:round}
.mlTip{position:fixed; left:0; top:0; z-index:35; padding:4px 9px; border-radius:12px; text-align:center; white-space:nowrap;
  font-size:10.5px; line-height:12px; font-weight:600; letter-spacing:-.005em; color:#fff;
  background:radial-gradient(circle at 35% 25%, #ff7a70, #e0443c 60%, #c4362e); box-shadow:inset 0 1px 0 rgba(255,255,255,.45), 0 3px 10px rgba(0,0,0,.35);
  transition:opacity .2s ease}
.mlTip.off{opacity:0; pointer-events:none}
/* ---- стекло как у лупы: под панелями — копия страницы, по краям она гнётся и расходится на цвета ---- */
.rf{background:transparent !important; -webkit-backdrop-filter:none !important; backdrop-filter:none !important; isolation:isolate}
.gv{position:absolute; inset:0; z-index:-1; border-radius:inherit; overflow:hidden; pointer-events:none; background:#050d11}
.gch{position:absolute; inset:0; overflow:hidden; isolation:isolate; background:#050d11}
.gch > i{position:absolute; inset:0; z-index:2; mix-blend-mode:multiply}
.gR > i{background:#f00} .gG > i{background:#0f0} .gB > i{background:#00f}
.gG, .gB{mix-blend-mode:screen}
.gsrc{position:absolute; left:0; top:0; will-change:auto !important;
  font-size:17px; line-height:25px; letter-spacing:-.022em; color:var(--gl-ink); text-align:left; font-weight:400;
  background:

  /* =====================================================================

     У края стекла картинка гнётся (вдавленное стекло, как у лупы), а каналы гнутся
     по-разному — поэтому по краю появляется лёгкая радуга. В середине картинка не тронута,

  (function glassInit() {

      { el: document.getElementById('tabs'), band: 22, k: -40, blur: 1.6, rad: 24, ext: [0, 0, 0, 0] },

          '<feDisplacementMap in="b" in2="m" scale="' + (p.k * c[1]).toFixed(1) + '" xChannelSelector="R" yChannelSelector="G"/></filter>';
      });

      if (old) old.remove();

      gEl.setAttribute('data-p', p.id);

      var fe = gEl.querySelectorAll('feImage');

    }

    /* копия активного экрана — в каждый канал каждой панели */
    var SX = 0, SY = 0;
    function strip(n) {
      if (n.nodeType !== 1) return;

      var r = p.el.getBoundingClientRect();
      var w = Math.round(r.width), h = Math.round(r.height);
      if (w < 2 || h < 2) return;
      if (Math.abs(w - p.w) > 1 || Math.abs(h - p.h) > 1) buildMap(p, w, h);
      var x = -r.left - window.scrollX, y = -r.top - window.scrollY;
      var tf = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px)';

    document.addEventListener('touchstart', function () { kick(400); }, { passive: true });
    document.addEventListener('touchmove', function () { kick(400); }, { passive: true });
    document.addEventListener('click', function () { kick(900); });
    var rt = 0;
    window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(reclone, 120); });
    var mt = 0;
    new MutationObserver(function () { clearTimeout(mt); mt = setTimeout(reclone, 40); })
      .observe(main, { subtree: true, childList: true, attributes: true, characterData: true });
    new MutationObserver(function () { kick(700); }).observe(document.getElementById('bs'), { attributes: true, attributeFilter: ['class', 'style'] });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(reclone);
    reclone();
  })();

  /* =====================================================================
     ЛУПА (как на основной странице: увеличение, вдавленное стекло, радуга по краю, инерция).
     Маленькая стоит справа под шапкой и не уезжает при прокрутке. Коснулся — выросла,
     её можно таскать пальцем. Короткое касание по большой лупе нажимает то, что под ней.
     Красный крестик — лупа уменьшается и возвращается на место.
     ===================================================================== */
  (function mobileLens() {
    var L = 180, MAG = 2.4, SPLIT = 0.02, BULGE = -28, SMALL = 50 / L;
    var SCALE = [1 + SPLIT, 1, 1 - SPLIT];

    for (var yy = 0; yy < 128; yy++) for (var xx = 0; xx < 128; xx++) {
      var ddx = (xx - 63.5) / 63.5, ddy = (yy - 63.5) / 63.5, kk = 4 * (yy * 128 + xx);
      var rr = Math.sqrt(ddx * ddx + ddy * ddy), ff = Math.pow(Math.min(1, rr), 2.1), ln = rr || 1;
      img.data[kk] = Math.round(128 + 127 * ff * ddx / ln); img.data[kk + 1] = Math.round(128 + 127 * ff * ddy / ln);
      img.data[kk + 2] = 128; img.data[kk + 3] = 255;
    }
    g2.putImageData(img, 0, 0);
    var url = cv.toDataURL('image/png');
    var NS = 'http://www.w3.org/2000/svg';
    var sv = document.createElementNS(NS, 'svg');
    sv.setAttribute('width', '0'); sv.setAttribute('height', '0'); sv.style.position = 'absolute';
    sv.innerHTML = '<filter id="mLensWarp" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB">' +
      '<feImage href="' + url + '" x="0" y="0" width="' + L + '" height="' + L + '" preserveAspectRatio="none" result="m"/>' +
      '<feDisplacementMap in="SourceGraphic" in2="m" scale="' + BULGE + '" xChannelSelector="R" yChannelSelector="G"/></filter>';
    document.body.appendChild(sv);
    sv.querySelector('feImage').setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', url);

    var lens = document.createElement('div');
    lens.className = 'mlens'; lens.style.setProperty('--L', L + 'px');
    lens.innerHTML = '<div class="mlView"><div class="mlCh mlR"><div class="mlSrc"></div><i></i></div><div class="mlCh mlG"><div class="mlSrc"></div><i></i></div><div class="mlCh mlB"><div class="mlSrc"></div><i></i></div></div>' +
      '<div class="mlRim"></div><div class="mlIcon"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg></div>';
    document.body.appendChild(lens);
    var xb = document.createElement('button');
    xb.className = 'mlX'; xb.setAttribute('aria-label', 'Закрыть лупу');
    xb.innerHTML = '<svg viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8"/></svg>';
    document.body.appendChild(xb);
    /* подпись под маленькой лупой — чтобы не путали с поиском */
    var TIP = { ru: 'Нажми<br>на меня', en: 'Tap<br>me', es: 'Tócame<br>aquí', uk: 'Натисни<br>на мене' };
    var tip = document.createElement('button');
    tip.className = 'mlTip';
    function tipText() { tip.innerHTML = TIP[LANG] || TIP.en; }
    tipText();
    document.body.appendChild(tip);
    document.getElementById('flags').addEventListener('click', function () { setTimeout(tipText, 0); });
    tip.addEventListener('click', function () { if (!big) grow(); });
    var srcs = lens.querySelectorAll('.mlSrc');
    var main = document.querySelector('main');

    /* копия активного экрана в координатах документа */
    function reclone() {
      var scr = main.querySelector('.screen.on'); if (!scr) return;
      var r = scr.getBoundingClientRect(), sx = r.left + window.scrollX, sy = r.top + window.scrollY;
      var dw = document.documentElement.scrollWidth, dh = document.documentElement.scrollHeight;
      for (var i = 0; i < srcs.length; i++) {
        var s = srcs[i], c = scr.cloneNode(true);
        c.removeAttribute('id');
        var ids = c.querySelectorAll('[id]'); for (var j = 0; j < ids.length; j++) ids[j].removeAttribute('id');
        c.style.cssText = 'position:absolute; margin:0; left:' + sx + 'px; top:' + sy + 'px; width:' + r.width + 'px';
        s.style.width = dw + 'px'; s.style.height = dh + 'px'; s.style.backgroundSize = window.innerWidth + 'px ' + window.innerHeight + 'px';
        s.textContent = ''; s.appendChild(c);
      }
      place();
    }
    var mt = 0;
    new MutationObserver(function () { clearTimeout(mt); mt = setTimeout(reclone, 40); })
      .observe(main, { subtree: true, childList: true, attributes: true, characterData: true });

    /* положение: центр линзы (cx, cy) в окне, масштаб линзы sc (маленькая ↔ большая) */
    var cx = 0, cy = 0, sc = SMALL, vx = 0, vy = 0, vs = 0, tx = 0, ty = 0, ts = SMALL, big = false, raf = 0, lastT = 0;
    function dock() { var hd = document.querySelector('.top').getBoundingClientRect(); return { x: window.innerWidth - 36, y: hd.bottom + 38 }; }
    function place() {
      var u = cx + window.scrollX, v = cy + window.scrollY;
      for (var c = 0; c < 3; c++) {
        var Z = MAG * SCALE[c];
        srcs[c].style.transform = 'translate(' + (L / 2 - u * Z).toFixed(1) + 'px,' + (L / 2 - v * Z).toFixed(1) + 'px) scale(' + Z + ')';
      }
      lens.style.transform = 'translate(' + cx.toFixed(1) + 'px,' + cy.toFixed(1) + 'px) scale(' + sc.toFixed(3) + ')';
      var o = L / 2 * sc * 0.72;
      xb.style.transform = 'translate(' + (cx + o).toFixed(1) + 'px,' + (cy - o).toFixed(1) + 'px)';
      tip.style.transform = 'translate(' + cx.toFixed(1) + 'px,' + (cy + L / 2 * sc + 6).toFixed(1) + 'px) translateX(-50%)';
    }
    /* пружины как на основной странице: положение — отклик 0,6 с, размер — побыстрее */
    var RESP = 0.6, ZETA = 0.85, OM = 2 * Math.PI / RESP, KS = OM * OM, CD = 2 * ZETA * OM;
    var OM2 = 2 * Math.PI / 0.38, KS2 = OM2 * OM2, CD2 = 2 * 0.78 * OM2;
    function step(now) {
      raf = 0;
      var raw = now - lastT, dt = Math.min(0.032, Math.max(0.001, raw / 1000)); lastT = now;
      if (raw > 150) { cx = tx; cy = ty; sc = ts; vx = vy = vs = 0; }
      else for (var rest = dt; rest > 0; rest -= 0.004) {
        var h = Math.min(0.004, rest);
        vx += (KS * (tx - cx) - CD * vx) * h; cx += vx * h;
        vy += (KS * (ty - cy) - CD * vy) * h; cy += vy * h;
        vs += (KS2 * (ts - sc) - CD2 * vs) * h; sc += vs * h;
      }
      place();
      if (Math.abs(tx - cx) > .05 || Math.abs(ty - cy) > .05 || Math.abs(ts - sc) > .001 || Math.abs(vx) > .5 || Math.abs(vy) > .5 || Math.abs(vs) > .01) raf = requestAnimationFrame(step);
      else { cx = tx; cy = ty; sc = ts; vx = vy = vs = 0; place(); }

    function go() { if (!raf) { lastT = performance.now(); raf = requestAnimationFrame(step); } }
    function clamp(x, y, s) {
      var r = L / 2 * s, hd = document.querySelector('.top').getBoundingClientRect().bottom;
      return { x: Math.min(window.innerWidth - r * .6, Math.max(r * .6, x)), y: Math.min(window.innerHeight - r * .6, Math.max(hd + r * .3, y)) };
    }
    function toDock() { var d = dock(); big = false; lens.classList.remove('big'); xb.classList.remove('on'); tip.classList.remove('off'); tx = d.x; ty = d.y; ts = SMALL; go(); }
    function grow() {
      big = true; lens.classList.add('big'); xb.classList.add('on'); tip.classList.add('off'); ts = 1;
      var p = clamp(window.innerWidth - L / 2 - 14, dock().y + L / 2 - 30, 1); tx = p.x; ty = p.y; go();
    }
    var d0 = dock(); cx = tx = d0.x; cy = ty = d0.y;

    /* пальцем: тянем за то место, где взяли; короткое касание большой лупы — нажатие того, что под ней */
    var gx = 0, gy = 0, sx0 = 0, sy0 = 0, t0 = 0, moved = false, wasBig = false;
    lens.addEventListener('touchstart', function (e) {
      if (e.touches.length !== 1) return;
      e.preventDefault();
      var t = e.touches[0]; sx0 = t.clientX; sy0 = t.clientY; t0 = Date.now(); moved = false; wasBig = big;
      if (!big) { grow(); gx = 0; gy = 0; } else { gx = tx - t.clientX; gy = ty - t.clientY; }
    }, { passive: false });
    lens.addEventListener('touchmove', function (e) {
      e.preventDefault();
      var t = e.touches[0];
      if (Math.abs(t.clientX - sx0) > 8 || Math.abs(t.clientY - sy0) > 8) moved = true;
      if (!moved) return;
      if (!wasBig) { gx = 0; gy = Math.min(-L * 0.35, gy); wasBig = true; gy = -L * 0.45; }   /* выросшую лупу держим чуть ниже центра, чтобы палец не закрывал */
      var p = clamp(t.clientX + gx, t.clientY + gy, 1); tx = p.x; ty = p.y; go();
    }, { passive: false });
    lens.addEventListener('touchend', function (e) {
      if (moved || !wasBig || Date.now() - t0 > 350) return;
      /* короткое касание — нажать то, что под лупой в этой точке */
      var Z = MAG, ux = cx + (sx0 - cx) / Z, uy = cy + (sy0 - cy) / Z;
      lens.style.pointerEvents = 'none';
      var el = document.elementFromPoint(ux, uy);
      lens.style.pointerEvents = '';
      if (el && el.closest) { var b = el.closest('button, [data-id], [data-stage]'); if (b) b.click(); }
    });
    /* мышью (на компьютере в узком окне) — то же самое */
    lens.addEventListener('mousedown', function (e) {
      e.preventDefault();
      if (!big) grow();
      gx = tx - e.clientX; gy = ty - e.clientY;
      function mv(ev) { var p = clamp(ev.clientX + gx, ev.clientY + gy, 1); tx = p.x; ty = p.y; go(); }
      function up() { document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up); }
      document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up);
    });
    xb.addEventListener('click', function (e) { e.stopPropagation(); toDock(); });
    xb.addEventListener('touchstart', function (e) { e.stopPropagation(); }, { passive: true });
    window.addEventListener('scroll', function () { place(); }, { passive: true });
    var rt = 0;
    window.addEventListener('resize', function () {
      clearTimeout(rt);
      rt = setTimeout(function () { if (!big) { var d = dock(); tx = d.x; ty = d.y; } else { var p = clamp(tx, ty, 1); tx = p.x; ty = p.y; } go(); reclone(); }, 120);
    });
    /* на других вкладках и под карточкой лупа не нужна */
    var tabsEl = document.getElementById('tabs');
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(reclone);
    reclone(); place();
    window.__lens = { grow: grow, dock: toDock };
  })();
  window.__m = { show: showScreen, open: openSheet, close: closeSheet, lang: function () { return LANG; } };

})();
